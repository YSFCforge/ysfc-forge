<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSFC Forge Performance Editor v5.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── DESIGN TOKENS ─── */
:root {
  --mono: 'DM Mono', ui-monospace, monospace;
  --sans: 'Inter', system-ui, sans-serif;
  --r: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --tr: .18s cubic-bezier(.4,0,.2,1);
  --tr-fast: .12s ease;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
}

[data-theme="light"] {
  --bg:        #f5f6fa;
  --sur:       #ffffff;
  --sur-2:     #f8f9fc;
  --sur-3:     #eef0f6;
  --sur-hover: #e8ebf3;
  --brd:       #e4e7ef;
  --brd-2:     #d4d8e4;
  --brd-3:     #c0c5d4;
  --txt:       #1a1d2e;
  --txt-2:     #4a5170;
  --dim:       #6b7290;
  --mut:       #9aa0b8;
  --acc:       #4c6ef5;
  --acc-2:     #6c8bff;
  --acc-soft:  rgba(76,110,245,.10);
  --acc-soft2: rgba(76,110,245,.18);
  --grn:       #16a34a;
  --org:       #ea580c;
  --red:       #dc2626;
  --warn:      #ca8a04;
  --awm2:      #2563eb;
  --awm2-soft: rgba(37,99,235,.10);
  --fmx:       #ea580c;
  --fmx-soft:  rgba(234,88,12,.10);
  --anx:       #16a34a;
  --anx-soft:  rgba(22,163,74,.10);
  --drum:      #9333ea;
  --drum-soft: rgba(147,51,234,.10);
  --shadow:    var(--shadow-md);
}

[data-theme="dark"] {
  --bg:        #0a0c14;
  --sur:       #11141d;
  --sur-2:     #161a25;
  --sur-3:     #1d2230;
  --sur-hover: #232838;
  --brd:       #232838;
  --brd-2:     #2e3447;
  --brd-3:     #3a4258;
  --txt:       #e5e8f0;
  --txt-2:     #b4bccf;
  --dim:       #7a82a0;
  --mut:       #4e556e;
  --acc:       #6c8bff;
  --acc-2:     #8aa3ff;
  --acc-soft:  rgba(108,139,255,.12);
  --acc-soft2: rgba(108,139,255,.22);
  --grn:       #22c55e;
  --org:       #fb923c;
  --red:       #f87171;
  --warn:      #fbbf24;
  --awm2:      #60a5fa;
  --awm2-soft: rgba(96,165,250,.14);
  --fmx:       #fb923c;
  --fmx-soft:  rgba(251,146,60,.14);
  --anx:       #4ade80;
  --anx-soft:  rgba(74,222,128,.14);
  --drum:      #c084fc;
  --drum-soft: rgba(192,132,252,.14);
  --shadow:    0 4px 16px rgba(0,0,0,.35);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 13px;
  font-feature-settings: "cv11", "ss01";
  background: var(--bg);
  color: var(--txt);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── SCROLLBARS ─── */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--brd-2); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--brd-3); }

/* ─── HEADER ─── */
header {
  display: flex; align-items: center;
  padding: 0 18px; height: 52px;
  background: var(--sur);
  border-bottom: 1px solid var(--brd);
  gap: 12px; flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  z-index: 100;
}
.logo {
  font-family: var(--mono); font-size: 14px; font-weight: 500;
  letter-spacing: .02em;
  display: flex; align-items: baseline; gap: 0;
}
.logo-dot { color: var(--acc); }
.logo-sub {
  font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mut); margin-left: 10px;
  font-family: var(--sans); font-weight: 500;
}
.h-gap { flex: 1; }

.hbtn {
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  background: var(--sur-2); border: 1px solid var(--brd-2);
  color: var(--txt-2); border-radius: var(--r);
  padding: 6px 13px;
  cursor: pointer;
  transition: all var(--tr-fast);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.hbtn:hover {
  background: var(--sur-3);
  border-color: var(--brd-3);
  color: var(--txt);
}
.hbtn:active { transform: scale(.98); }
.hbtn:disabled { opacity: .4; cursor: default; pointer-events: none; }
.hbtn.primary {
  background: var(--acc);
  border-color: var(--acc);
  color: white;
}
.hbtn.primary:hover {
  background: var(--acc-2);
  border-color: var(--acc-2);
}
.hbtn.danger:hover {
  background: var(--red);
  border-color: var(--red);
  color: white;
}
.hbtn.icon-only { padding: 6px 8px; }

/* Engine pill — shown in header */
.engine-pill {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  padding: 3px 10px; border-radius: 99px; letter-spacing: .06em;
  text-transform: uppercase;
}
.pill-FMX  { background: var(--fmx-soft); color: var(--fmx); }
.pill-AWM2 { background: var(--awm2-soft); color: var(--awm2); }
.pill-ANX  { background: var(--anx-soft); color: var(--anx); }
.pill-Drum { background: var(--drum-soft); color: var(--drum); }

/* ─── MAIN LAYOUT ─── */
main {
  flex: 1 1 0;
  display: grid;
  grid-template-columns: var(--left-w, 240px) 1fr var(--right-w, 280px);
  overflow: hidden;
  height: calc(100vh - 52px);
  min-height: 0;
}
/* Grid items must allow shrinking below content width/height */
main > * { min-width: 0; min-height: 0; }

/* ─── LEFT SIDEBAR ─── */
.left {
  background: var(--sur);
  border-right: 1px solid var(--brd);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.resize-handle {
  position: absolute;
  top: 0; right: -3px;
  width: 6px; height: 100%;
  cursor: col-resize;
  z-index: 10;
  background: transparent;
  transition: background var(--tr-fast);
}
.resize-handle:hover,
.resize-handle.dragging { background: var(--acc); opacity: .4; }

.left-top {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--brd);
  flex-shrink: 0;
}
.sec-label {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 6px;
}
.name-input {
  width: 100%;
  font-family: var(--mono); font-size: 14px; font-weight: 500;
  background: var(--sur-2);
  border: 1px solid var(--brd);
  color: var(--txt);
  padding: 8px 10px;
  border-radius: var(--r);
  transition: all var(--tr-fast);
}
.name-input:focus {
  outline: none;
  border-color: var(--acc);
  background: var(--sur);
  box-shadow: 0 0 0 3px var(--acc-soft);
}

/* Performance list */
/* Default flex-basis is ~90% of available height; user can resize up to ~100%.
   Hard pixel cap removed — height is bounded by the sidebar itself. */
.left-perf-list {
  flex: 1 1 auto;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--brd);
  position: relative;
  overflow: hidden;
}
.perf-list-scroll {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 4px 6px 8px;
  min-height: 0;
}
.perf-item {
  padding: 7px 10px;
  font-size: 12px;
  cursor: pointer;
  border-radius: var(--r);
  display: flex; align-items: center; gap: 8px;
  transition: background var(--tr-fast);
  user-select: none;
}
.perf-item:hover { background: var(--sur-2); }
.perf-item.active {
  background: var(--acc-soft);
  color: var(--acc);
  font-weight: 500;
}
.perf-item .perf-idx {
  font-family: var(--mono); font-size: 10px;
  color: var(--mut);
  min-width: 22px;
}
.perf-item .perf-name {
  flex: 1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.perf-item .perf-edited {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--org);
}
.perf-eng-tag {
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  flex-shrink: 0;
  opacity: 0.85;
  letter-spacing: 0.02em;
  margin-left: auto;
}
.engine-pill.pill-inline {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  vertical-align: middle;
  display: inline-block;
}
.list-resize-handle {
  position: absolute;
  left: 0; right: 0; bottom: -3px;
  height: 6px;
  cursor: row-resize;
  z-index: 10;
  background: transparent;
  transition: background var(--tr-fast);
}
.list-resize-handle:hover,
.list-resize-handle.dragging { background: var(--acc); opacity: .4; }

/* Sub-element navigator (operators/elements/drum keys) */
/* Default: shrinks to fit its content (or 0 if empty). On tabs with many
   sub-elements (drum keys), grows as needed but never larger than ~50%
   of remaining space — perf-list always retains its priority. */
.sub-nav {
  padding: 10px 12px;
  overflow-y: auto;
  flex: 0 1 auto;
  min-height: 0;
  max-height: 50%;
}
.sub-nav:empty { padding: 0; }

/* Inline element/OP/OSC selector row — between overview table and detail heading */
.inline-elem-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--brd);
  background: var(--sur);
}
.inline-elem-btn {
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 20px;
  border: 1px solid var(--brd-2);
  background: var(--sur-2);
  color: var(--txt-2);
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.inline-elem-btn:hover { background: var(--sur-hover); color: var(--txt); }
.inline-elem-btn.active.engine-FMX,
.inline-elem-btn.active.engine-AWM2,
.inline-elem-btn.active.engine-ANX { background: var(--awm2-soft); color: var(--awm2); border-color: var(--awm2); }

/* Operator / Element / OSC overview table */
.op-overview { margin-bottom: 12px; }
.op-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  font-family: var(--mono);
}
.op-table thead th {
  padding: 5px 8px;
  text-align: left;
  color: var(--dim);
  font-weight: 500;
  border-bottom: 1px solid var(--brd);
  background: var(--sur-2);
  font-size: 10px;
  font-family: var(--sans);
}
.op-table tbody tr.op-row {
  cursor: pointer;
  border-bottom: 1px solid var(--brd);
  transition: background 0.1s;
}
.op-table tbody tr.op-row:hover { background: var(--sur-hover); }
.op-table tbody tr.op-row.active { background: var(--acc-soft); }
.op-table tbody tr.op-off { opacity: 0.45; }
.op-table td { padding: 4px 8px; vertical-align: middle; }
.op-label { font-weight: 600; color: var(--txt-2); width: 36px; }
.op-val { color: var(--txt); text-align: right; white-space: nowrap; }
.op-bar-wrap {
  display: inline-block;
  width: 60px;
  height: 6px;
  background: var(--sur-3);
  border-radius: 3px;
  overflow: hidden;
  vertical-align: middle;
  margin-right: 6px;
}
.op-bar {
  height: 100%;
  background: var(--acc);
  border-radius: 3px;
  min-width: 2px;
}
.part-bar {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 12px;
  height: 32px;
  border-bottom: 1px solid var(--brd);
  background: var(--sur);
  overflow-x: auto;
  overflow-y: hidden;
  flex-shrink: 0;
  scrollbar-width: none;
}
.part-bar::-webkit-scrollbar { display: none; }
.part-bar.hidden { display: none; }
.part-bar-label {
  font-size: 11px;
  color: var(--dim);
  margin-right: 8px;
  flex-shrink: 0;
  user-select: none;
}
.part-chip {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  height: 30px;
  border-radius: 0;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--txt-2);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
  margin-right: 2px;
  transition: color 0.12s, border-bottom-color 0.12s;
  gap: 1px;
}
.part-chip:hover { color: var(--txt); }
.part-chip.active {
  color: var(--acc);
  border-bottom-color: var(--acc);
}
.part-chip-eng {
  font-size: 8px;
  font-weight: 400;
  opacity: 0.75;
  line-height: 1;
}
.sub-nav-section {
  margin-bottom: 14px;
}
.sub-nav-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.sub-nav-grid.wide {
  grid-template-columns: repeat(2, 1fr);
}
.sub-btn {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  background: var(--sur-2);
  border: 1px solid var(--brd);
  color: var(--txt-2);
  padding: 6px 8px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all var(--tr-fast);
  text-align: center;
}
.sub-btn:hover {
  background: var(--sur-3);
  border-color: var(--brd-2);
  color: var(--txt);
}
.sub-btn.active {
  background: var(--acc);
  border-color: var(--acc);
  color: white;
}
.sub-btn.engine-AWM2.active { background: var(--awm2); border-color: var(--awm2); }
.sub-btn.engine-FMX.active  { background: var(--awm2); border-color: var(--awm2); }
.sub-btn.engine-ANX.active  { background: var(--awm2); border-color: var(--awm2); }
.sub-btn.engine-Drum.active { background: var(--awm2); border-color: var(--awm2); }

/* Drum key list — vertical with note names */
.drum-key-list {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--brd);
  border-radius: var(--r);
}
.drum-key-item {
  display: flex; align-items: center;
  padding: 5px 10px;
  font-size: 11px;
  cursor: pointer;
  border-bottom: 1px solid var(--brd);
  gap: 8px;
  transition: background var(--tr-fast);
}
.drum-key-item:last-child { border-bottom: none; }
.drum-key-item:hover { background: var(--sur-2); }
.drum-key-item.active {
  background: var(--awm2-soft);
  color: var(--awm2);
  font-weight: 500;
}
.drum-key-item .key-num {
  font-family: var(--mono); color: var(--mut);
  min-width: 22px;
}
.drum-key-item .key-note {
  font-family: var(--mono); font-weight: 500;
  min-width: 28px;
}
.drum-key-item .key-on {
  margin-left: auto;
  font-size: 9px;
  padding: 1px 5px;
  background: var(--grn);
  color: white;
  border-radius: 3px;
  font-weight: 500;
}
.drum-key-item.off .key-on { background: var(--mut); }

/* ─── CENTRE ─── */
.centre {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
  min-width: 0;
}

/* Tabs */
.tab-bar {
  display: flex;
  gap: 0;
  background: var(--sur);
  border-bottom: 1px solid var(--brd);
  padding: 0 16px;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: thin;
}
.tab-bar::-webkit-scrollbar { height: 0; }
.tab {
  font-size: 12.5px; font-weight: 500;
  color: var(--dim);
  background: transparent;
  border: none;
  padding: 14px 16px;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color var(--tr-fast);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--txt-2); }
.tab.active {
  color: var(--acc);
  border-bottom-color: var(--acc);
}
.tab.active.engine-AWM2,
.tab.active.engine-FMX,
.tab.active.engine-ANX,
.tab.active.engine-Drum { color: var(--awm2); border-bottom-color: var(--awm2); }
.tab-badge {
  display: inline-block;
  font-family: var(--mono); font-size: 9px;
  padding: 1px 5px;
  border-radius: 99px;
  background: var(--sur-3);
  color: var(--mut);
  margin-left: 4px;
  font-weight: 500;
}
.tab.active .tab-badge { background: var(--acc-soft); color: var(--acc); }

/* Content area */
.content {
  flex: 1 1 0;
  overflow-y: auto;
  padding: 20px 24px 80px;
  min-height: 0;
}
.content-inner {
  max-width: 980px;
  margin: 0 auto;
}

/* Drop zone */
.drop-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  gap: 14px;
}
.dz-icon {
  font-size: 64px;
  color: var(--brd-3);
  margin-bottom: 8px;
  font-weight: 300;
  line-height: 1;
}
.dz-text { font-size: 16px; font-weight: 500; color: var(--txt-2); }
.dz-sub { font-size: 13px; color: var(--dim); }

/* ─── SECTIONS ─── */
.section {
  background: var(--sur);
  border: 1px solid var(--brd);
  border-radius: var(--r-lg);
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color var(--tr-fast);
}
.section:hover { border-color: var(--brd-2); }
.sec-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--sur-2);
  border-bottom: 1px solid var(--brd);
}
.sec-title {
  font-size: 13px; font-weight: 600;
  color: var(--txt);
  letter-spacing: -.01em;
  display: flex; align-items: center; gap: 8px;
}
.sec-badge {
  font-family: var(--mono); font-size: 9.5px;
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--sur-3);
  color: var(--dim);
  font-weight: 500;
  letter-spacing: .03em;
}
.sec-body {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 22px;
}
.sec-body.single { grid-template-columns: 1fr; }
.sec-body.compact { padding: 10px 14px; gap: 4px 18px; }

/* Slider rows */
.srow {
  display: grid;
  grid-template-columns: 1fr;
  gap: 4px;
  padding: 6px 0;
  min-width: 0;
}
.srow-hdr {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 8px;
}
.sname {
  font-size: 11.5px;
  color: var(--txt-2);
  font-weight: 500;
}
.sval {
  font-family: var(--mono); font-size: 11px;
  color: var(--dim);
  font-weight: 500;
}
.sval.chg {
  color: var(--org);
  font-weight: 600;
}
.srow input[type="range"] {
  width: 100%;
  -webkit-appearance: none;
  height: 4px;
  background: var(--sur-3);
  border-radius: 2px;
  outline: none;
  margin: 4px 0;
}
.srow input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--acc);
  cursor: pointer;
  transition: transform var(--tr-fast), box-shadow var(--tr-fast);
  border: 2px solid var(--sur);
  box-shadow: 0 0 0 1px var(--brd-2);
}
.srow input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}
.srow input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--acc);
  cursor: pointer;
  border: 2px solid var(--sur);
  box-shadow: 0 0 0 1px var(--brd-2);
}
.srow input[type="range"].chg::-webkit-slider-thumb { background: var(--org); }
.srow input[type="range"].chg::-moz-range-thumb { background: var(--org); }

/* Select rows */
.srow select {
  width: 100%;
  background: var(--sur-2);
  border: 1px solid var(--brd);
  color: var(--txt);
  font-family: var(--sans);
  font-size: 12px;
  padding: 5px 8px;
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color var(--tr-fast);
}
.srow select:hover { border-color: var(--brd-2); }
.srow select:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-soft);
}

/* Checkbox rows */
.cb-row {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 0;
  cursor: pointer;
  user-select: none;
}
.cb-row input[type="checkbox"] {
  width: 16px; height: 16px;
  cursor: pointer;
  accent-color: var(--acc);
}
.cb-row .sname {
  font-size: 12px;
}

/* Number input rows */
.num-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
}
.num-row .sname { flex: 1; }
.num-row input[type="number"] {
  width: 70px;
  background: var(--sur-2);
  border: 1px solid var(--brd);
  color: var(--txt);
  font-family: var(--mono); font-size: 12px;
  padding: 4px 7px;
  border-radius: var(--r);
}
.num-row input[type="number"]:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px var(--acc-soft);
}

/* Algorithm grid (FM-X) */
.algo-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 8px;
}
.algo-btn {
  font-family: var(--mono); font-size: 10px;
  background: var(--sur-2);
  border: 1px solid var(--brd);
  color: var(--txt-2);
  padding: 4px;
  border-radius: 4px;
  cursor: pointer;
  text-align: center;
  transition: all var(--tr-fast);
}
.algo-btn:hover {
  border-color: var(--awm2);
  color: var(--awm2);
}
.algo-btn.active {
  background: var(--awm2);
  border-color: var(--awm2);
  color: white;
  font-weight: 600;
}

/* Engine-colored sections */
.section.engine-AWM2 .sec-header,
.section.engine-FMX  .sec-header,
.section.engine-ANX  .sec-header,
.section.engine-Drum .sec-header { background: var(--awm2-soft); }
.section.engine-AWM2 .sec-title,
.section.engine-FMX  .sec-title,
.section.engine-ANX  .sec-title,
.section.engine-Drum .sec-title { color: var(--awm2); }

/* ─── RIGHT SIDEBAR (Pending Changes) ─── */
.right {
  background: var(--sur);
  border-left: 1px solid var(--brd);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  min-height: 0;
}
.right-resize-handle {
  position: absolute;
  top: 0; left: -3px;
  width: 6px; height: 100%;
  cursor: col-resize;
  z-index: 10;
  background: transparent;
  transition: background var(--tr-fast);
}
.right-resize-handle:hover,
.right-resize-handle.dragging { background: var(--acc); opacity: .4; }
.right-section {
  padding: 14px 14px;
  border-bottom: 1px solid var(--brd);
  display: flex;
  flex-direction: column;
  min-height: 0;
  flex: 1 1 auto;
}
.right-section:last-child { border-bottom: none; }
.info-title {
  font-size: 12px; font-weight: 600;
  color: var(--txt);
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.changes-count {
  font-family: var(--mono); font-size: 10px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--acc-soft);
  color: var(--acc);
  font-weight: 600;
  margin-left: auto;
}
.delta-list {
  flex: 1 1 auto;
  overflow-y: auto;
  margin: 0 -14px;
  padding: 0 14px;
  min-height: 0;
}
.delta-item {
  font-family: var(--mono); font-size: 10.5px;
  padding: 6px 9px;
  margin-bottom: 4px;
  background: var(--sur-2);
  border-left: 2px solid var(--org);
  border-radius: 4px;
  color: var(--txt-2);
  word-break: break-all;
}
.delta-item .delta-label {
  font-family: var(--sans); font-size: 11px;
  color: var(--txt); font-weight: 500;
  display: block;
  margin-bottom: 2px;
}
.no-chg {
  font-size: 11.5px;
  color: var(--mut);
  font-style: italic;
  padding: 16px 4px;
  text-align: center;
}

/* ─── TOAST ─── */
.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(120%);
  background: var(--sur);
  border: 1px solid var(--brd-2);
  color: var(--txt);
  padding: 11px 18px;
  border-radius: var(--r-md);
  font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lg);
  transition: transform var(--tr);
  z-index: 9999;
  max-width: 80vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--grn); border-left-width: 3px; }
.toast.error   { border-color: var(--red); border-left-width: 3px; }
.toast.warn    { border-color: var(--warn); border-left-width: 3px; }

/* ─── INFO NOTE ─── */
.info-note {
  padding: 10px 14px;
  background: var(--sur-2);
  border-left: 3px solid var(--acc);
  border-radius: var(--r);
  font-size: 12px;
  color: var(--txt-2);
  margin-bottom: 12px;
  line-height: 1.5;
}
.info-note .info-title-inline {
  font-weight: 600;
  color: var(--txt);
  margin-right: 4px;
}

/* ─── UTILITY ─── */
.hidden { display: none !important; }
.row { display: flex; gap: 12px; align-items: center; }
.flex-1 { flex: 1; }

/* Headline for content tabs */
.content-headline {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--brd);
}
.content-headline h2 {
  font-size: 18px; font-weight: 600;
  color: var(--txt);
  letter-spacing: -.02em;
}
.content-headline .sub {
  font-size: 12px;
  color: var(--dim);
}

/* Responsive: hide right sidebar on narrow screens */
@media (max-width: 1100px) {
  main { grid-template-columns: var(--left-w, 200px) 1fr; }
  .right { display: none; }
}

// FX type lo/hi byte split

function fxFromBytes(lo, hi) { return hi * 128 + lo; }

// ─── STATE ────────────────────────────────────────────────────────
const S = {
  raw: null,          // Uint8Array of entire file

  perfIdx: 0,
  perfBytes: null,    // bytes of current perf (reference into raw)
  origBytes: null,    // backup of perf bytes for diff

// ─── PARSER ───────────────────────────────────────────────────────
// Based on v4.1 — proven across 2010+ test files
function dirChunkPos(d, tag) {
  const tc = tag.split('').map(c => c.charCodeAt(0));
  for (let i = 0; i < 64; i += 8) {
    if (d[72+i]===tc[0]&&d[72+i+1]===tc[1]&&d[72+i+2]===tc[2]&&d[72+i+3]===tc[3]) {
      const pos = (d[72+i+4]<<24)|(d[72+i+5]<<16)|(d[72+i+6]<<8)|d[72+i+7];
      if (pos > 0 && pos + 8 < d.length) return pos;
    }
  }
  return -1;
}

function parseAllPerfs(buf) {
  const d = new Uint8Array(buf);

  // Validate YAMAHA-YSFC header
  const magic = String.fromCharCode(d[0],d[1],d[2],d[3],d[4],d[5],d[6],d[7],d[8],d[9],d[10]);
  if (magic !== 'YAMAHA-YSFC') throw new Error('Not a Y2L file (bad header)');

  // EPFM is always at offset 64
  if (d[64]!==0x45||d[65]!==0x50||d[66]!==0x46||d[67]!==0x4D)
    throw new Error('EPFM not found at offset 64');

  // Locate DPFM via EPFM directory
  let dpfmAbsOff = dirChunkPos(d, 'DPFM');
  if (dpfmAbsOff < 0) {
    // Fallback: scan for largest DPFM
    let best = -1, bestSz = 0;
    for (let i = 0; i < d.length - 8; i++) {
      if (d[i]===0x44&&d[i+1]===0x50&&d[i+2]===0x46&&d[i+3]===0x4D) {
        const sz = (d[i+4]<<24)|(d[i+5]<<16)|(d[i+6]<<8)|d[i+7];
        if (sz > bestSz) { bestSz=sz; best=i; }
      }
    }
    if (best < 0) throw new Error('DPFM not found');
    dpfmAbsOff = best;
  }

  // Read EPFM engine bits (rec[15]) per performance.
  // v5.3: EPFM is the authoritative engine source and works for both
  // v4.x (Montage/MODX classic) and v5.x (Montage M/MODX M) files.
  // blob[6700] sits at different offsets in the two formats, so reading
  // from EPFM rec[15] is the safe cross-format approach.
  //   rec[15]: 0x01=AWM2/Drum, 0x02=FM-X, 0x04=AN-X
  //
  // v4.x layout: EPFM chunk at d[64] IS the directory (contains chunk pointers).
  // The actual Entr records are in a second EPFM chunk pointed to by the catalog
  // embedded inside the first. We find them by scanning for 'Entr' records directly.
  // v5.x layout: dirChunkPos('EPFM') returns the chunk with Entr records directly.
  const epfmEngineBits = [];
  {
    // Strategy: find the EPFM chunk that contains 'Entr' records.
    // Try dirChunkPos first (v5.x). If that fails or yields no Entr,
    // scan the inline EPFM payload at d[64] for a nested EPFM with Entr records.
    function readEntrBits(ep) {
      // ep = EPFM payload (after tag+size). Returns array of rec[15] values.
      const bits = [];
      const count = (ep[0]<<24)|(ep[1]<<16)|(ep[2]<<8)|ep[3];
      if (count < 1 || count > 640) return bits;
      const mark = [0x45,0x6e,0x74,0x72]; // 'Entr'
      if (ep[4]!==mark[0]||ep[5]!==mark[1]||ep[6]!==mark[2]||ep[7]!==mark[3]) return bits;
      let epos = 8; // skip count(4) + global 'Entr' tag(4)
      for (let i = 0; i < count && epos + 4 <= ep.length; i++) {
        const rlen = (ep[epos]<<24)|(ep[epos+1]<<16)|(ep[epos+2]<<8)|ep[epos+3];
        if (rlen < 8 || rlen > 300) break;
        epos += 4;
        bits.push(ep.length > epos + 15 ? ep[epos + 15] : 0);
        epos += rlen;
        if (i < count - 1 && epos + 4 <= ep.length &&
            ep[epos]===mark[0] && ep[epos+1]===mark[1] &&
            ep[epos+2]===mark[2] && ep[epos+3]===mark[3]) {
          epos += 4;
        }
      }
      return bits;
    }

    // Try v5.x path: EPFM pointed to by directory
    const epfmAbsOff = dirChunkPos(d, 'EPFM');
    if (epfmAbsOff >= 0) {
      const bits = readEntrBits(d.subarray(epfmAbsOff + 8));
      if (bits.length > 0) epfmEngineBits.push(...bits);
    }

    // Try v4.x path: EPFM at d[64] contains a catalog; scan its payload for
    // a nested EPFM chunk that holds the actual Entr records.
    if (epfmEngineBits.length === 0 &&
        d[64]===0x45&&d[65]===0x50&&d[66]===0x46&&d[67]===0x4D) {
      const epfmSz = (d[68]<<24)|(d[69]<<16)|(d[70]<<8)|d[71];
      // Scan the EPFM payload for a nested 'EPFM' chunk
      const limit = Math.min(72 + epfmSz, d.length - 8);
      for (let i = 72; i < limit; i++) {
        if (d[i]===0x45&&d[i+1]===0x50&&d[i+2]===0x46&&d[i+3]===0x4D) {
          const bits = readEntrBits(d.subarray(i + 8));
          if (bits.length > 0) { epfmEngineBits.push(...bits); break; }
        }
      }
      // v4.x fallback: the actual EPFM Entr chunk is at the address stored in
      // the catalog. Scan from the start of the non-directory file area.
      if (epfmEngineBits.length === 0) {
        for (let i = 200; i < Math.min(d.length - 8, 2000); i++) {
          if (d[i]===0x45&&d[i+1]===0x50&&d[i+2]===0x46&&d[i+3]===0x4D) {
            const bits = readEntrBits(d.subarray(i + 8));
            if (bits.length > 0) { epfmEngineBits.push(...bits); break; }
          }
        }
      }
    }
  }

  // DPFM layout: tag(4) + size(4) + count(4) + ['Data'(4) + plen(4) + data(plen)] × N
  const dpfm = d.subarray(dpfmAbsOff + 8);
  const n = (dpfm[0]<<24)|(dpfm[1]<<16)|(dpfm[2]<<8)|dpfm[3];
  if (n < 1 || n > 640) throw new Error(`Invalid perf count: ${n}`);

  const perfs = [];
  let pos = 4;  // skip count
  for (let i = 0; i < n; i++) {
    if (pos + 8 > dpfm.length) break;
    // pos+0..4 = 'Data' marker, pos+4..8 = perf len
    const plen = (dpfm[pos+4]<<24)|(dpfm[pos+5]<<16)|(dpfm[pos+6]<<8)|dpfm[pos+7];
    const dataStart = pos + 8;
    if (dataStart + plen > dpfm.length) break;
    // Create a slice (COPY) into raw — we'll write back at absStart on export
    const absStart = dpfmAbsOff + 8 + dataStart;
    const bytes = new Uint8Array(d.buffer, d.byteOffset + absStart, plen).slice();
    // Read name from blob[4] until NUL — up to 20 chars (Yamaha max perf name length).
    // Previously capped at k<22 (18 chars) which truncated 19-20 char names.
    let name = '';
    for (let k = 4; k < 26 && bytes[k] !== 0; k++) {
      name += String.fromCharCode(bytes[k]);
    }
    name = name.trim() || `(perf ${i+1})`;
    perfs.push({
      name, bytes, plen,
      epfmBits: epfmEngineBits[i] ?? null,  // rec[15] from EPFM, null if unavailable
      dpfmBufOffset: dataStart,
      absStart,  // absolute offset in raw file
    });
    pos = dataStart + plen;
  }
  if (perfs.length === 0) throw new Error('No performances found');
  return { perfs, dpfmAbsOff };
}

function detectEngine(perf) {
  // EPFM rec[15] is the primary engine source, correct for both v4.x and v5.x.
  // Exception: 0x01 is shared by AWM2 AND Drum — use blob[6700] to disambiguate.
  if (perf.epfmBits != null) {
    const eb = perf.epfmBits;
    if (eb & 0x04) return 'ANX';
    if (eb & 0x02) return 'FMX';
    if (eb & 0x01) {
      // Drum and AWM2 both use 0x01 — check blob[6700] to tell them apart
      const b = perf.bytes;
      if (b.length > 6700 && b[6700] === 1) return 'Drum';
      return 'AWM2';
    }
  }
  // Fallback: blob[6700] — correct for v5.x files, wrong for v4.x
  const b = perf.bytes;
  if (b.length > 6700) {
    const eb = b[6700];
    if (eb === 0) return 'AWM2';
    if (eb === 1) return 'Drum';
    if (eb === 2) return 'FMX';
    if (eb === 3) return 'ANX';
  }
  // Last resort: name heuristic
  const n = perf.name;
  if (n.includes('(AN-X)')) return 'ANX';
  if (n.includes('(FM-X)')) return 'FMX';
  if (n.includes('Drum'))   return 'Drum';
  return 'AWM2';
}

// Operator / element base helpers — part-aware (v5.4)
// Add partDelta(S.currentPart) to shift constants to the active part's engine pool
function fmxOpBase(op)   { return FMX_OP1_BASE   + (op-1) * FMX_OP_STRIDE   + partDelta(S.currentPart); }
function awm2ElemBase(e) { return AWM2_ELEM1_BASE + (e-1)  * AWM2_ELEM_STRIDE + partDelta(S.currentPart); }
function drumKeyBase(k)  { return DRUM_KEY1_BASE  + (k-1)  * DRUM_KEY_STRIDE  + partDelta(S.currentPart); }
function anxOscBase(o)   { return ANX_OSC_BASES[o] + partDelta(S.currentPart); }

// AWM2 element count for current part (v5.4: dynamic, max 128)
// Primary: blob[engineBase - 2] = EC byte (serializer: AWM2_ELEMENT_COUNT_REL_FROM_ENGINE_TYPE = -2)
// Fallback: size-based calculation
function getAWM2ElemCount() {
  if (!S.perfBytes) return AWM2_ELEM_COUNT;
  const pd = partDelta(S.currentPart);
  const engineBase = 12466 + pd;  // engine_start_abs = AWM2_ELEM1_BASE - 3 + pd
  const ecByte = S.perfBytes[engineBase - 2];
  if (ecByte >= 8 && ecByte <= 128) return ecByte;
  // Fallback: derive from blob size
  const elem1Base = AWM2_ELEM1_BASE + pd;
  const elemBytes = S.perfBytes.length - elem1Base;
  if (elemBytes <= 0) return AWM2_ELEM_COUNT;
  return Math.max(8, Math.min(128, Math.round((elemBytes + 4) / AWM2_ELEM_STRIDE)));
}

// Multi-part base helpers (v5.4)
// Part N Common starts at PART_BASE + (N-1)*PART_STRIDE
function partBase(n) { return PART_BASE + (n - 1) * PART_STRIDE; }

// Engine pool for part N starts after Part Common data.
// Part Common layout: 5758 bytes of common data + 5-byte sub-blob separator header.
// Engine pool starts at partBase(n) + 5763.
// For Part 1 this equals PART_BASE + 5763 = 6708 + 5763 = 12471 ≈ confirmed constants.
const PART_ENGINE_POOL_OFFSET = 5763;
function enginePoolBase(n) { return partBase(n) + PART_ENGINE_POOL_OFFSET; }

// The per-engine "absolute" constants (FMX_OP1_BASE etc.) are only correct for Part 1.
// For other parts we must offset them by the part delta.
function partDelta(n) { return partBase(n) - PART_BASE; }  // = (n-1)*PART_STRIDE

// Detect engine for all parts in current perf blob.
// Returns array indexed 1..numParts.
function detectPartEngines(blob, numParts, epfmBits) {
  const ENG_MAP = { 0: 'AWM2', 1: 'Drum', 2: 'FMX', 3: 'ANX' };
  const EPFM_MAP = { 0x01: 'AWM2', 0x02: 'FMX', 0x04: 'ANX' };
  const result = [null]; // 1-indexed

  // Part 1: use EPFM bits as primary, blob[6700] to disambiguate Drum vs AWM2
  let e1 = null;
  if (epfmBits != null) {
    if (epfmBits & 0x04) e1 = 'ANX';
    else if (epfmBits & 0x02) e1 = 'FMX';
    else if (epfmBits & 0x01) {
      // Drum and AWM2 share 0x01 — use blob[6700] to tell them apart
      e1 = (blob.length > 6700 && blob[6700] === 1) ? 'Drum' : 'AWM2';
    }
  }
  if (!e1 && blob.length > 6700) e1 = ENG_MAP[blob[6700]] || 'AWM2';
  result.push(e1 || 'AWM2');

  // Parts 2..N: scan for sub-blob separator 0x00000015 after part 1's engine pool
  // Each part's engine byte sits immediately before the 0x00000015 separator
  let scanned = 0;
  for (let i = 7000; i < blob.length - 4 && scanned < numParts - 1; i++) {
    if (blob[i]===0 && blob[i+1]===0 && blob[i+2]===0 && blob[i+3]===0x15) {
      const eb = blob[i - 1];
      result.push(ENG_MAP[eb] || 'AWM2');
      scanned++;
      i += 3;
    }
  }
  // Pad remaining parts with AWM2 if scan found fewer than expected
  while (result.length <= numParts) result.push('AWM2');
  return result;
}

// ─── WRITE / DELTA ────────────────────────────────────────────────
function writeByte(abs, val, label) {
  if (!S.perfBytes) return;
  val = val & 0xFF;
  S.perfBytes[abs] = val;
  const origVal = S.origBytes[abs];
  if (val === origVal) {
    S.deltas.delete(abs);
  } else {
    S.deltas.set(abs, { value: val, origValue: origVal, label });
  }
  S.perfs[S.perfIdx].edited = S.deltas.size > 0;
  renderDeltas();
  renderPerfList();
}

function onSlider(id, label, uiVal, min, max, abs, encType) {
  uiVal = Math.max(min, Math.min(max, uiVal));
  const raw = dec[encType] ? dec[encType](uiVal) : uiVal;
  writeByte(abs, raw, label);
  const el = document.getElementById(id);
  if (el) el.value = raw;
  const valEl = document.getElementById(id + '_v');
  if (valEl) {
    valEl.textContent = uiVal;
    valEl.classList.add('chg');
  }
  const rangeEl = document.getElementById(id);
  if (rangeEl) rangeEl.classList.add('chg');
}

// Build a checkbox row
function cbRow(label, abs) {
  const val = S.perfBytes[abs];
  const id = 'cb_' + abs;
  const chg = S.deltas.has(abs);
  return `<div class="cb-row" onclick="document.getElementById('${id}').click()">
    <input type="checkbox" id="${id}" ${val?'checked':''}
      onclick="event.stopPropagation();writeByte(${abs},this.checked?1:0,'${label}')">
    <span class="sname${chg?' sval chg':''}">${label}</span>

// MIDI note slider
function midiRow(label, abs) {
  const val = S.perfBytes[abs];
  const chg = S.deltas.has(abs);
  const id = 'midi_' + abs;
  return `<div class="srow">
    <div class="srow-hdr">
      <span class="sname">${label}</span>

    </div>

      oninput="writeByte(${abs},+this.value,'${label}');document.getElementById('${id}_v').textContent=midiName(+this.value)+' ('+this.value+')';document.getElementById('${id}_v').classList.add('chg');this.classList.add('chg')">
  </div>`;

// Build section wrapper
function sec(title, body, opts) {
  opts = opts || {};
  const engineClass = opts.engine ? `engine-${opts.engine}` : '';
  const badge = opts.badge ? `<span class="sec-badge">${opts.badge}</span>` : '';
  const bodyClass = opts.single ? 'sec-body single' : 'sec-body';
  return `<div class="section ${engineClass}">
    <div class="sec-header">
      <div class="sec-title">${title}${badge}</div>
    </div>
    <div class="${bodyClass}">${body}</div>
  </div>`;
}

function infoNote(title, body) {
  return `<div class="info-note"><span class="info-title-inline">${title}</span>${body}</div>`;
}

// ─── TAB SYSTEM ───────────────────────────────────────────────────

// Tab definitions per engine: [{ id, label, badge?, renderFn (string) }]
// Note: render functions are stored as STRINGS and resolved at call-time
// via window[name]() to avoid hoisting issues across <script> blocks.
const TABS = {
  AWM2: [
    { id: 'common',     label: 'Common',                          renderFn: 'renderCommon' },
    { id: 'element',    label: 'Element',     badge: 'per-elem',  renderFn: 'renderAWM2Element' },
    { id: 'part-eg',    label: 'Part EG',                         renderFn: 'renderAWM2PartEG' },
    { id: 'fx',         label: 'Insertion FX',                    renderFn: 'renderFX' }
  ],
  FMX: [
    { id: 'common',     label: 'Common',                          renderFn: 'renderCommon' },
    { id: 'algorithm',  label: 'Algorithm',                       renderFn: 'renderFMXAlgo' },
    { id: 'operator',   label: 'Operator',    badge: 'per-OP',    renderFn: 'renderFMXOp' },
    { id: 'pitch-eg',   label: 'Pitch EG',                        renderFn: 'renderFMXPeg' },
    { id: 'filter',     label: 'Filter',                          renderFn: 'renderFMXFilter' },
    { id: 'lfo',        label: 'LFO',                             renderFn: 'renderFMXLfo' },
    { id: 'fx',         label: 'Insertion FX',                    renderFn: 'renderFX' }
  ],
  ANX: [
    { id: 'common',     label: 'Common',                          renderFn: 'renderCommon' },
    { id: 'part',       label: 'Part Settings',                   renderFn: 'renderANXPart' },
    { id: 'oscillator', label: 'Oscillator',  badge: 'per-OSC',   renderFn: 'renderANXOsc' },
    { id: 'filter',     label: 'Filters',                         renderFn: 'renderANXFilters' },
    { id: 'envelopes',  label: 'Envelopes',                       renderFn: 'renderANXEnvelopes' },
    { id: 'lfo',        label: 'LFO',                             renderFn: 'renderANXLfo' },
    { id: 'modifier',   label: 'Wave Folder',                     renderFn: 'renderANXModifier' },
    { id: 'fx',         label: 'Insertion FX',                    renderFn: 'renderFX' }
  ],
  Drum: [
    { id: 'common',     label: 'Common',                          renderFn: 'renderCommon' },
    { id: 'drum-part',  label: 'Part',                            renderFn: 'renderDrumPart' },
    { id: 'drum-key',   label: 'Drum Key',    badge: 'per-key',   renderFn: 'renderDrumKey' },
    { id: 'fx',         label: 'Insertion FX',                    renderFn: 'renderFX' }
  ]
};

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  if (!S.engine) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const tabs = TABS[S.engine] || [];
  if (!S.currentTab || !tabs.find(t => t.id === S.currentTab)) {
    S.currentTab = tabs[0]?.id;
  }
  bar.innerHTML = tabs.map(t => {
    const active = S.currentTab === t.id;
    const badge = t.badge ? `<span class="tab-badge">${t.badge}</span>` : '';
    return `<button class="tab ${active?'active engine-'+S.engine:''}"
      onclick="selectTab('${t.id}')">${t.label}${badge}</button>`;
  }).join('');
}

function selectTab(id) {
  S.currentTab = id;
  renderTabBar();
  renderContent();
}

function renderContent() {
  const c = document.getElementById('content');
  if (!S.perfBytes) {
    c.innerHTML = `<div class="drop-zone">
      <div class="dz-icon">◈</div>
      <div class="dz-text">Open a Y2L file to start editing</div>
      <div class="dz-sub">Supports AWM2 · FM-X · AN-X · Drum engines</div>
    </div>`;
    return;
  }
  const tabs = TABS[S.engine] || [];
  const tab = tabs.find(t => t.id === S.currentTab);
  if (!tab) { c.innerHTML = '<div class="content-inner">No tab selected</div>'; return; }
  // Resolve render function by name at call-time
  const fn = window[tab.renderFn] || globalThis[tab.renderFn];
  if (typeof fn !== 'function') {
    c.innerHTML = `<div class="content-inner"><div class="info-note">Render function <code>${tab.renderFn}</code> not found.</div></div>`;
    console.error('Missing render function:', tab.renderFn);
    return;
  }
  c.innerHTML = `<div class="content-inner">${fn()}</div>`;
}

// ─── SUB-NAV (left sidebar) ───────────────────────────────────────

function renderSubNav() {
  const nav = document.getElementById('subNav');
  if (!S.engine || !S.perfBytes) { nav.innerHTML = ''; return; }

  // Use current part's engine (S.engine is already set to S.partEngines[S.currentPart])
  const tab = (TABS[S.engine] || []).find(t => t.id === S.currentTab);
  if (!tab) { nav.innerHTML = ''; return; }

  let html = '';

  // Drum Keys only — other engines (FMX/AWM2/ANX) use inline selectors in content
  if (S.engine === 'Drum' && S.currentTab === 'drum-key') {
    html += `<div class="sub-nav-section">
      <div class="sec-label">Drum Keys (${DRUM_KEY_COUNT})</div>
      <div class="drum-key-list">`;
    for (let k = 1; k <= DRUM_KEY_COUNT; k++) {
      const base = drumKeyBase(k);
      const midi = DRUM_MIDI_START + (k-1);
      const isOn = S.perfBytes[base + DRUM_KEY.drumKeySW] === 1;
      const active = S.currentSubElem === k;
      html += `<div class="drum-key-item ${active?'active':''} ${isOn?'':'off'}"
        onclick="selectSubElem(${k})">
        <span class="key-num">${k}</span>
        <span class="key-note">${midiName(midi)}</span>
        <span class="key-on">${isOn?'ON':'OFF'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  nav.innerHTML = html;
}

function selectSubElem(n) {
  S.currentSubElem = n;
  renderSubNav();
  renderContent();
}

function selectPart(n) {
  if (n < 1 || n > S.numParts) return;
  S.currentPart = n;
  S.engine = S.partEngines[n] || 'AWM2';
  S.currentTab = null;    // reset to first tab for this engine
  S.currentSubElem = 1;
  renderPartSelector();
  renderTabBar();
  renderSubNav();
  renderContent();
}

// ─── COMMON TAB (shared) ──────────────────────────────────────────

function renderCommon() {
  const headline = `<div class="content-headline">
    <h2>Performance Common</h2>
    <div class="sub">Engine: ${(() => {
      const ENG_LABEL = { AWM2: 'AWM2', FMX: 'FM-X', ANX: 'AN-X', Drum: 'Drum' };
      const e = S.partEngines[S.currentPart] || 'AWM2';
      return `<span class="engine-pill pill-${e} pill-inline">${ENG_LABEL[e]||e}</span>`;
    })()}</div>
  </div>`;

  // Volume/Pan/Tempo
  const vol = sl('perfVol', 'Volume', 68, 'direct', 0, 127);
  const pan = sl('perfPan', 'Pan', 70, 'c64', -64, 63);
  const tempo = sl('perfTempo', 'Tempo (BPM)', 92, 'direct', 5, 300);

  const body1 = vol + pan + tempo;

  // Toggles
  const body2 = cbRow('Portamento Master', 29) +
    cbRow('Reverb On', 34) +
    cbRow('Variation On', 35) +
    cbRow('Master FX On', 37) +
    cbRow('MS Master On', 39) +
    cbRow('Common Audio Switch', 50);

  // Part N Mix — offset relative to current part (v5.4)
  const pd = partDelta(S.currentPart);
  const pn = S.currentPart;
  const partVol = sl(`partVol_${pn}`, 'Part Volume', 6831 + pd, 'direct', 0, 127);
  const partPan = sl(`partPan_${pn}`, 'Part Pan', 6833 + pd, 'c64', -64, 63);

  return headline +
    sec('Performance', body1) +

    sec(`Part ${pn} Mix`, partBody, { engine: S.engine });

  const oscSelector = subElemSelectorRow(

  </div>`;

  const baseBody = selRow('Waveform', base + ANX_OSC_OFF.waveform, ANX_WAVES) +
    selRow('Octave', base + ANX_OSC_OFF.octave, ANX_OCTAVES) +
    sl16('anx_pitch_'+o, 'Pitch (cents)', base + ANX_OSC_OFF.pitch_lo, 'c256', -1024, 1023) +
    sl('anx_pw_'+o, 'Pulse Width', base + ANX_OSC_OFF.pulse_width, 'c128', -128, 127) +
    sl('anx_pwv_'+o, 'PW / Vel', base + ANX_OSC_OFF.pulse_width_vel, 'direct', 0, 127) +
    sl('anx_ws_'+o, 'Wave Shaper', base + ANX_OSC_OFF.wave_shaper, 'direct', 0, 127) +
    sl('anx_wsv_'+o, 'Shaper / Vel', base + ANX_OSC_OFF.wave_shaper_vel, 'direct', 0, 127);

  const modBody = sl('anx_peg_'+o, 'PEG Depth', base + ANX_OSC_OFF.peg_depth_lo, 'direct', 0, 255) +

    sl('anx_pwld_'+o, 'PW LFO Depth', base + ANX_OSC_OFF.pulse_width_lfo_depth, 'c128', -128, 127) +
    sl('anx_seg_'+o, 'Shaper EG Depth', base + ANX_OSC_OFF.shaper_eg_depth, 'c128', -128, 127) +
    sl('anx_slfo_'+o, 'Shaper LFO Depth', base + ANX_OSC_OFF.shaper_lfo_depth, 'c128', -128, 127);

  const syncBody = sl('anx_sp_'+o, 'Sync Pitch', base + ANX_OSC_OFF.sync_pitch, 'direct', 0, 127) +
    sl('anx_spv_'+o, 'Sync / Vel', base + ANX_OSC_OFF.sync_vel, 'direct', 0, 127) +
    sl('anx_seg2_'+o, 'Sync EG Depth', base + ANX_OSC_OFF.sync_eg_depth, 'direct', 0, 127) +
    sl('anx_sld_'+o, 'Sync LFO Depth', base + ANX_OSC_OFF.sync_lfo_depth, 'direct', 0, 127) +

  const egBody = sl('anx_egA_'+o, 'Attack', base + ANX_OSC_OFF.eg_attack, 'direct', 0, 255) +

function renderANXFilters() {

  function filterBlock(F, n) {
    const flt = sl16(`anx_fc${n}`, 'Cutoff', F.cutoff_lo, 'direct', 0, 1023) +
      sl(`anx_fcv${n}`, 'Cutoff / Vel', F.cutoff_vel, 'c64', -64, 63) +
      sl16(`anx_fed${n}`, 'FEG Depth', F.feg_depth_lo, 'direct', 0, 1023) +
      sl(`anx_fedv${n}`, 'FEG / Vel', F.feg_depth_vel, 'direct', 0, 127) +
      sl16(`anx_fld${n}`, 'LFO Depth', F.lfo_depth_lo, 'direct', 0, 1023) +
      sl(`anx_fck${n}`, 'Cutoff / Key', F.cutoff_key, 'direct', 0, 127) +
      sl(`anx_fres${n}`, 'Resonance', F.resonance, 'direct', 0, 127) +

function renderANXLfo() {
  const headline = `<div class="content-headline">
    <h2>LFOs</h2>
    <div class="sub">Four independent LFO systems</div>
  </div>`;

  function lfoBlock(prefix, wave_abs, speed_abs, phase_abs, delay_abs, fadein_abs) {
    return selRow('Wave', wave_abs, ANX_LFO_WAVES) +
      sl16(prefix+'_sp', 'Speed', speed_abs, 'direct', 0, 1023) +
      sl(prefix+'_ph', 'Phase (16-step)', phase_abs, 'direct', 0, 15) +
      sl(prefix+'_dl', 'Delay', delay_abs, 'direct', 0, 127) +
      sl(prefix+'_fi', 'Fade In', fadein_abs, 'direct', 0, 127);
  }

  // Pitch LFO (Triangle default, no wave at PRE_OSC — uses default)
  // Filter LFO
  const fltLfo = lfoBlock('anx_flfo',
    ANX_PRE_OSC.filter_lfo_wave, ANX_PRE_OSC.filter_lfo_speed_lo,
    ANX_PRE_OSC.filter_lfo_phase, ANX_PRE_OSC.filter_lfo_delay, ANX_PRE_OSC.filter_lfo_fadein);

  // Amp LFO
  const ampLfo = lfoBlock('anx_alfo',
    ANX_PRE_OSC.amp_lfo_wave, ANX_PRE_OSC.amp_lfo_speed_lo,
    ANX_PRE_OSC.amp_lfo_phase, ANX_PRE_OSC.amp_lfo_delay, ANX_PRE_OSC.amp_lfo_fadein);

  // Pitch LFO (no Wave control in pre-OSC; only speed + phase + delay + fadein)
  const pitchLfo = sl16('anx_plfo_sp', 'Speed', ANX_PRE_OSC.pitch_lfo_speed_lo, 'direct', 0, 1023) +
    sl('anx_plfo_ph', 'Phase (16-step)', ANX_PRE_OSC.pitch_lfo_phase, 'direct', 0, 15) +
    sl('anx_plfo_dl', 'Delay', ANX_PRE_OSC.pitch_lfo_delay, 'direct', 0, 127) +
    sl('anx_plfo_fi', 'Fade In', ANX_PRE_OSC.pitch_lfo_fadein, 'direct', 0, 127);

  // Mod LFO (in modifier block)
  const modLfo = selRow('Wave', ANX_MOD_LFO.wave, ANX_LFO_WAVES) +
    sl16('anx_mlfo_sp', 'Speed', ANX_MOD_LFO.speed_lo, 'direct', 0, 1023) +
    sl('anx_mlfo_dl', 'Delay', ANX_MOD_LFO.delay, 'direct', 0, 127) +
    sl('anx_mlfo_fi', 'Fade In', ANX_MOD_LFO.fadein, 'direct', 0, 127);

  return headline +
    sec('Pitch LFO', pitchLfo, { engine: 'ANX' }) +
    sec('Filter LFO', fltLfo, { engine: 'ANX' }) +
    sec('Amp LFO', ampLfo, { engine: 'ANX' }) +
    sec('Mod LFO', modLfo, { engine: 'ANX' });

function renderFX() {
  const headline = `<div class="content-headline">
    <h2>Insertion FX</h2>
    <div class="sub">InsA and InsB effect type selection · Part ${S.currentPart}</div>
  </div>`;

  const pd = partDelta(S.currentPart);
  const INSA_LO = PART_BASE + 275 + pd, INSA_HI = PART_BASE + 276 + pd;
  const INSB_LO = PART_BASE + 332 + pd, INSB_HI = PART_BASE + 333 + pd;

  const insAType = fxFromBytes(S.perfBytes[INSA_LO], S.perfBytes[INSA_HI]);
  const insBType = fxFromBytes(S.perfBytes[INSB_LO], S.perfBytes[INSB_HI]);

  function fxSelector(label, currentIdx, abs_lo, abs_hi) {
    let opts = '';
    Object.entries(FX_TYPES).forEach(([idx, name]) => {
      opts += `<option value="${idx}" ${+idx===currentIdx?'selected':''}>${name}</option>`;
    });
    return `<div class="srow">
      <div class="srow-hdr"><span class="sname">${label}</span>
        <span class="sval">${FX_TYPES[currentIdx] || 'Unknown ('+currentIdx+')'}</span></div>
      <select onchange="updateFX(${abs_lo},${abs_hi},+this.value,'${label}')">${opts}</select>
    </div>`;
  }

  const body = fxSelector('Insertion FX A', insAType, INSA_LO, INSA_HI) +
    fxSelector('Insertion FX B', insBType, INSB_LO, INSB_HI);

  return headline +
    sec('FX Type Selection', body, { single: true });
}

function updateFX(abs_lo, abs_hi, idx, label) {
  writeByte(abs_lo, fxTypeLo(idx), label + ' (lo)');
  writeByte(abs_hi, fxTypeHi(idx), label + ' (hi)');
  renderContent();
}
</script>
<script>
// ─── FILE LOADING ─────────────────────────────────────────────────

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const buf = new Uint8Array(e.target.result);
      const { perfs, dpfmAbsOff, dpfmDataStart } = parseAllPerfs(buf);

      S.raw = buf;
      S.fileName = file.name;
      S.perfs = perfs.map(p => ({ ...p, edited: false }));
      S.dpfmAbsOff = dpfmAbsOff;
      S.dpfmDataStart = dpfmDataStart;
      S.deltas = new Map();

      selectPerf(0);

      // Show UI
      document.getElementById('perfInfoBlock').style.display = '';
      document.getElementById('leftPerfList').style.display = S.perfs.length > 1 ? '' : 'none';
      document.getElementById('exportBtn').disabled = false;
      document.getElementById('resetBtn').disabled = false;

      const pl = S.perfs.length;
      showToast(`Loaded ${pl} performance${pl!==1?'s':''}: ${file.name}`, 'success');
    } catch (err) {
      console.error(err);
      showToast(`Error: ${err.message}`, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function selectPerf(idx) {
  if (idx < 0 || idx >= S.perfs.length) return;

  // Save current state if switching
  if (S.perfBytes && S.perfIdx !== idx) {
    // The perfBytes view already points into raw, so changes are live.
    // But we need to keep deltas only for current perf; reset for new
  }

  S.perfIdx = idx;
  const perf = S.perfs[idx];
  S.perfBytes = perf.bytes;
  S.origBytes = new Uint8Array(perf.bytes);  // snapshot for diff
  S.perfName = perf.name;
  S.currentTab = null;  // reset to first tab
  S.currentSubElem = 1;
  S.currentPart = 1;
  S.deltas = new Map();
  perf.edited = false;

  // Compute part count and per-part engines (v5.4)
  S.numParts = (perf.bytes.length > 6695 && perf.bytes[6695] > 0 && perf.bytes[6695] <= 16)
    ? perf.bytes[6695] : 1;
  S.partEngines = detectPartEngines(perf.bytes, S.numParts, perf.epfmBits ?? null);
  S.engine = S.partEngines[1] || 'AWM2';
  perf.engine = S.engine;

  // Update UI elements
  document.getElementById('perfNameInput').value = S.perfName;
  // Engine pill hidden — engine shown per-performance in the list
  const pill = document.getElementById('enginePill');
  pill.classList.add('hidden');

  renderPerfList();
  renderPartSelector();
  renderTabBar();
  renderSubNav();
  renderContent();
  renderDeltas();
}

function renderPartSelector() {
  const el = document.getElementById('partBar');
  if (!el) return;
  if (!S.perfBytes) {
    el.classList.add('hidden');
    el.innerHTML = '';
    return;
  }
  const ENG_LABEL = { AWM2: 'AWM2', FMX: 'FM-X', ANX: 'AN-X', Drum: 'Drum' };
  let html = '<span class="part-bar-label">Part</span>';
  for (let p = 1; p <= S.numParts; p++) {
    const eng = S.partEngines[p] || 'AWM2';
    const active = S.currentPart === p;
    html += `<button class="part-chip${active ? ' active' : ''}" onclick="selectPart(${p})">
      P${p}<span class="part-chip-eng">${ENG_LABEL[eng] || eng}</span>
    </button>`;
  }
  el.innerHTML = html;
  el.classList.remove('hidden');
  // Scroll active chip into view
  const activeChip = el.querySelector('.part-chip.active');
  if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

function renderPerfList() {
  const el = document.getElementById('perfListEl');
  if (!el || !S.perfs.length) return;
  el.innerHTML = S.perfs.map((p, i) => {
    const active = i === S.perfIdx;
    const edited = p.edited;
    return `<div class="perf-item ${active?'active':''}"
      onclick="selectPerf(${i})">
      <span class="perf-idx">${i+1}</span>
      <span class="perf-name">${escHtml(p.name)}</span>
      ${edited ? '<span class="perf-edited" title="Edited"></span>' : ''}
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function writePerfName(newName) {
  if (!S.perfBytes) return;
  newName = (newName || '').replace(/[^\x20-\x7E]/g, '').slice(0, 18);
  S.perfName = newName;

  // Write into perf bytes 4..22 (ASCII, null-padded)
  // CRITICAL: don't overwrite bytes 22+ (timestamps validated by MODX)
  for (let i = 0; i < 18; i++) {
    const ch = i < newName.length ? newName.charCodeAt(i) : 0;
    if (S.perfBytes[4 + i] !== ch) {
      writeByte(4 + i, ch, 'Performance Name');
    }
  }
  // Update the perfs list display name
  S.perfs[S.perfIdx].name = newName;
  renderPerfList();
}

// ─── EXPORT ───────────────────────────────────────────────────────

function exportY2L() {
  if (!S.raw) return;

  // Since perfBytes is a view into raw via slice (which returns a COPY),
  // we need to splice edited perfBytes back into raw.
  // Each perf in S.perfs has absStart (its position in raw).

  // Build new raw with all edited perfs spliced in
  const out = new Uint8Array(S.raw);

  let editedCount = 0;
  for (const perf of S.perfs) {
    if (perf.edited) {
      editedCount++;
      // Splice perf.bytes back at perf.absStart
      out.set(perf.bytes, perf.absStart);
    }
  }
  // Current perf may have unsaved diffs in S.perfBytes (which IS perf.bytes)
  // so the loop above already handles it.

  // Trigger download
  const blob = new Blob([out], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const baseName = S.fileName.replace(/\.y2l$/i, '');
  a.href = url;
  a.download = `${baseName}_edited.Y2L`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast(`Exported ${editedCount || 1} performance${editedCount!==1?'s':''}!`, 'success');
}

function resetChanges() {
  if (!S.origBytes) return;
  // Restore perfBytes from origBytes
  for (let i = 0; i < S.origBytes.length; i++) {
    S.perfBytes[i] = S.origBytes[i];
  }
  S.deltas = new Map();
  S.perfs[S.perfIdx].edited = false;
  S.perfName = readPerfNameFromBytes(S.perfBytes);
  S.perfs[S.perfIdx].name = S.perfName;
  document.getElementById('perfNameInput').value = S.perfName;
  renderPerfList();
  renderContent();
  renderDeltas();
  showToast('Reset to original', 'success');
}

function readPerfNameFromBytes(b) {
  let n = '';
  for (let i = 4; i < 22; i++) {
    if (b[i] === 0) break;
    n += String.fromCharCode(b[i]);
  }
  return n.trim();
}

// ─── DELTA PANEL ──────────────────────────────────────────────────

function renderDeltas() {
  const el = document.getElementById('deltaList');
  const countEl = document.getElementById('changesCount');
  if (!el) return;

  if (S.deltas.size === 0) {
    el.innerHTML = '<div class="no-chg">No changes yet</div>';
    countEl.classList.add('hidden');
    return;
  }

  countEl.textContent = S.deltas.size;
  countEl.classList.remove('hidden');

  // Group by label
  const grouped = new Map();
  S.deltas.forEach((d, abs) => {
    const key = d.label;
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push({ abs, value: d.value, origValue: d.origValue });
  });

  const items = [];
  grouped.forEach((rows, label) => {
    rows.forEach(r => {
      items.push(`<div class="delta-item">
        <span class="delta-label">${escHtml(label)}</span>
        <span>@${r.abs}: ${r.origValue} → ${r.value}</span>
      </div>`);
    });
  });
  el.innerHTML = items.join('');
}

// ─── TOAST ────────────────────────────────────────────────────────

let toastTimer = null;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.classList.remove('show');
  }, 3000);
}

// ─── EVENT LISTENERS ──────────────────────────────────────────────

document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
document.getElementById('fileInputDz').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

document.getElementById('exportBtn').addEventListener('click', exportY2L);
document.getElementById('resetBtn').addEventListener('click', resetChanges);

document.getElementById('perfNameInput').addEventListener('input', e => {
  writePerfName(e.target.value);
});

// Drag and drop
document.body.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
document.body.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && /\.y2l$/i.test(file.name)) {
    loadFile(file);
  } else if (file) {
    showToast('Drop a .Y2L file', 'error');
  }
});

// ─── RESIZE HANDLES ───────────────────────────────────────────────

function initResizeHandles() {
  // Sidebar width
  const sbHandle = document.getElementById('sidebarResizeHandle');
  const main = document.querySelector('main');
  let dragging = false;

  sbHandle.addEventListener('mousedown', e => {
    dragging = true;
    sbHandle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.max(180, Math.min(400, e.clientX));
    main.style.setProperty('--left-w', w + 'px');
    localStorage.setItem('ysfc-left-w', w);
  });
  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      sbHandle.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
    }
  });

  // Perf list height
  const listHandle = document.getElementById('listResizeHandle');
  const perfList = document.getElementById('leftPerfList');
  const leftSidebar = document.getElementById('leftSidebar');
  let listDragging = false;
  let startY, startH;

  listHandle.addEventListener('mousedown', e => {
    listDragging = true;
    startY = e.clientY;
    startH = perfList.offsetHeight;
    listHandle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'row-resize';
  });
  document.addEventListener('mousemove', e => {
    if (!listDragging) return;
    // Max height = full available sidebar height minus other parts (.left-top + .sub-nav minimum)
    const sidebarH = leftSidebar.clientHeight;
    const leftTop = leftSidebar.querySelector('.left-top');
    const reservedTop = leftTop ? leftTop.offsetHeight : 0;
    // Reserve a tiny strip (24px) so the drag handle doesn't go off-screen
    const maxH = sidebarH - reservedTop - 24;
    const newH = Math.max(80, Math.min(maxH, startH + (e.clientY - startY)));
    perfList.style.height = newH + 'px';
    perfList.style.flex = 'none';
    localStorage.setItem('ysfc-list-h', newH);
  });
  document.addEventListener('mouseup', () => {
    if (listDragging) {
      listDragging = false;
      listHandle.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
    }
  });

  // Right sidebar width
  const rightHandle = document.getElementById('rightResizeHandle');
  let rightDragging = false;
  if (rightHandle) {
    rightHandle.addEventListener('mousedown', e => {
      rightDragging = true;
      rightHandle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    });
    document.addEventListener('mousemove', e => {
      if (!rightDragging) return;
      // Right sidebar width = window.innerWidth - e.clientX
      const w = Math.max(200, Math.min(500, window.innerWidth - e.clientX));
      main.style.setProperty('--right-w', w + 'px');
      localStorage.setItem('ysfc-right-w', w);
    });
    document.addEventListener('mouseup', () => {
      if (rightDragging) {
        rightDragging = false;
        rightHandle.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
      }
    });
  }

  // Restore saved sizes
  const savedW = localStorage.getItem('ysfc-left-w');
  if (savedW) main.style.setProperty('--left-w', savedW + 'px');
  const savedRightW = localStorage.getItem('ysfc-right-w');
  if (savedRightW) main.style.setProperty('--right-w', savedRightW + 'px');
  const savedH = localStorage.getItem('ysfc-list-h');
  if (savedH) {
    perfList.style.height = savedH + 'px';
    perfList.style.flex = 'none';
  }
}
