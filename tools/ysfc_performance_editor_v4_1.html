<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSFC Forge — Performance Editor v4.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 6px;
  --r-lg: 10px;
  --tr: .15s ease;
  --op-c: #3a9eff;
  --op-m: #9b6bff;
}

[data-theme="dark"] {
  --bg:      #0a0c12;
  --sur:     #101318;
  --sur2:    #161b26;
  --sur3:    #1d2234;
  --brd:     #222840;
  --brd2:    #2c3450;
  --txt:     #c4cce0;
  --dim:     #5a6882;
  --mut:     #333d58;
  --acc:     #00cfc0;
  --acc2:    #0099ee;
  --grn:     #3ecf7a;
  --org:     #e88c3a;
  --red:     #e05050;
  --awm2:    #3a8ef5;
  --fmx:     #f07240;
  --anx:     #3ed47a;
}
[data-theme="light"] {
  --bg:      #eef0f5;
  --sur:     #ffffff;
  --sur2:    #f4f5fa;
  --sur3:    #eaecf2;
  --brd:     #dde0ea;
  --brd2:    #c8ccd8;
  --txt:     #1a1d2e;
  --dim:     #5a607a;
  --mut:     #9aa0b8;
  --acc:     #0091c2;
  --acc2:    #0060cc;
  --grn:     #1a9e55;
  --org:     #d97706;
  --red:     #c0402a;
  --awm2:    #1a6fd4;
  --fmx:     #c95420;
  --anx:     #1a9e55;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 13px;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  display: flex; align-items: center;
  padding: 0 18px; height: 48px;
  background: var(--sur);
  border-bottom: 1px solid var(--brd);
  gap: 12px; flex-shrink: 0;
}
.logo { font-family: var(--mono); font-size: 14px; font-weight: 500; }
.logo-dot { color: var(--acc); }
.logo-sub { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); margin-left: 6px; }
.h-gap { flex: 1; }

.hbtn {
  font-family: var(--mono); font-size: 10px; letter-spacing: .05em;
  background: var(--sur2); border: 1px solid var(--brd2);
  color: var(--dim); border-radius: 20px; padding: 4px 12px;
  cursor: pointer; transition: border-color var(--tr), color var(--tr);
  display: flex; align-items: center; gap: 5px;
}
.hbtn:hover { border-color: var(--acc); color: var(--txt); }
.hbtn:disabled { opacity: .35; cursor: default; }

.engine-pill {
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  padding: 2px 9px; border-radius: 99px; letter-spacing: .04em;
}
.pill-FMX  { background: rgba(240,114,64,.12); color: var(--fmx); border: 1px solid rgba(240,114,64,.25); }
.pill-AWM2 { background: rgba(58,142,245,.12); color: var(--awm2); border: 1px solid rgba(58,142,245,.25); }
.pill-ANX  { background: rgba(62,212,122,.12); color: var(--anx); border: 1px solid rgba(62,212,122,.25); }

/* ── MAIN ── */
main {
  flex: 1; display: grid;
  grid-template-columns: var(--left-w, 220px) 1fr 220px;
  overflow: hidden;
  height: calc(100vh - 48px);
}
/* Resize handle between left sidebar and centre */
.resize-handle {
  position: absolute;
  top: 0; right: -3px;
  width: 6px; height: 100%;
  cursor: col-resize;
  z-index: 10;
  background: transparent;
  transition: background .15s;
}
.resize-handle:hover,
.resize-handle.dragging { background: var(--acc); opacity: .5; }

/* ── LEFT SIDEBAR ── */
.left {
  border-right: 1px solid var(--brd);
  background: var(--sur);
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
  min-width: 160px;
  max-width: 480px;
}
.left-top {
  padding: 12px 14px;
  border-bottom: 1px solid var(--brd);
  flex-shrink: 0;
}
.perf-name {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: var(--txt); margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sec-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--mut); margin-bottom: 7px;
}

/* Section nav */
.sec-nav { padding: 8px 0; flex: 1; overflow-y: auto; }
.nav-group { padding: 0 8px 4px; }
.nav-group-label {
  font-family: var(--mono); font-size: 9px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--mut);
  padding: 8px 6px 4px; display: block;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 5px;
  cursor: pointer; transition: background var(--tr);
  border-left: 2px solid transparent;
  margin-bottom: 1px;
}
.nav-item:hover { background: var(--sur2); }
.nav-item.active { background: var(--sur2); border-left-color: var(--acc); }
.nav-num {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  width: 28px; flex-shrink: 0; color: var(--dim);
}
.nav-item.is-carrier .nav-num { color: var(--op-c); }
.nav-item.is-modulator .nav-num { color: var(--op-m); }
.nav-role { font-size: 10px; color: var(--mut); font-family: var(--mono); }
.nav-val { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); }
.nav-txt { font-family: var(--mono); font-size: 11px; color: var(--dim); }

/* ── CENTRE ── */
.centre {
  overflow-y: auto; padding: 18px 20px;
  background: var(--bg);
}

/* Drop zone */
.drop-zone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 14px; color: var(--mut);
  min-height: 300px;
}
.dz-icon { font-size: 42px; opacity: .3; }
.dz-text { font-family: var(--mono); font-size: 12.5px; letter-spacing: .06em; }
.dz-sub { font-size: 11px; opacity: .6; }

/* Editor sections */
.esec {
  background: var(--sur);
  border: 1px solid var(--brd);
  border-radius: var(--r-lg);
  margin-bottom: 14px;
  overflow: hidden;
}
.esec-hdr {
  display: flex; align-items: center;
  padding: 9px 15px; border-bottom: 1px solid var(--brd); gap: 8px;
}
.esec-title {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--dim); font-weight: 500;
}
.esec-badge {
  font-family: var(--mono); font-size: 9px; padding: 1px 7px; border-radius: 3px;
  background: rgba(0,207,192,.08); color: var(--acc);
}
.esec-body { padding: 14px 15px; }

/* Param grid */
.pgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}
.pgrid-wide { grid-column: 1 / -1; }
.pgrid-2 { grid-template-columns: repeat(2, 1fr); }
.pgrid-3 { grid-template-columns: repeat(3, 1fr); }
.pgrid-4 { grid-template-columns: repeat(4, 1fr); }

/* Slider row */
.srow { display: flex; flex-direction: column; gap: 4px; }
.srow-hdr { display: flex; justify-content: space-between; align-items: baseline; }
.sname {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--mut);
}
.sval {
  font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--txt);
  min-width: 30px; text-align: right;
}
.sval.chg { color: var(--acc); }

.name-input {
  width: 100%;
  background: var(--sur2);
  border: 1px solid var(--brd2);
  border-radius: var(--r);
  color: var(--txt);
  font-family: var(--mono);
  font-size: 12px;
  padding: 5px 8px;
  outline: none;
  transition: border-color var(--tr);
}
.name-input:focus { border-color: var(--acc); }

.left-perf-list {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--brd);
  height: var(--list-h, 180px);
  min-height: 60px;
  max-height: 70vh;
  flex-shrink: 0;
  position: relative;
}
.perf-list-scroll {
  overflow-y: auto;
  flex: 1;
}
/* Resize handle below the perf list */
.list-resize-handle {
  position: absolute;
  bottom: -3px; left: 0;
  width: 100%; height: 6px;
  cursor: row-resize;
  z-index: 10;
  background: transparent;
  transition: background .15s;
}
.list-resize-handle:hover,
.list-resize-handle.dragging { background: var(--acc); opacity: .5; }
.perf-list-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  cursor: pointer;
  transition: background var(--tr);
  border-left: 2px solid transparent;
}
.perf-list-item:hover { background: var(--sur2); }
.perf-list-item.active {
  background: var(--sur2);
  border-left-color: var(--acc);
}
.pli-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--acc);
  flex-shrink: 0;
  visibility: hidden;  /* always reserve space */
}
.perf-list-item.dirty .pli-dot { visibility: visible; }
.pli-num {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--mut);
  flex-shrink: 0;
  min-width: 24px;
}
.pli-name {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--txt);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

input[type=range] {
  -webkit-appearance: none; width: 100%; height: 3px;
  border-radius: 2px; background: var(--sur3); outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px;
  border-radius: 50%; background: var(--acc); transition: transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }
input[type=range].chg::-webkit-slider-thumb { background: var(--acc); box-shadow: 0 0 0 3px rgba(0,207,192,.2); }
input[type=checkbox] { accent-color: var(--acc); width: 14px; height: 14px; cursor: pointer; }

select {
  background: var(--sur2); border: 1px solid var(--brd2); border-radius: var(--r);
  color: var(--txt); padding: 5px 8px; font-family: var(--mono); font-size: 11.5px;
  cursor: pointer; width: 100%; outline: none;
}
select:focus { border-color: var(--acc); }

/* Algorithm display */
.algo-wrap { display: flex; align-items: flex-start; gap: 16px; }
.algo-big {
  font-family: var(--mono); font-size: 46px; font-weight: 500;
  color: var(--txt); line-height: 1; min-width: 64px;
}
.algo-diagram {
  display: grid; grid-template-columns: repeat(4, 30px);
  grid-template-rows: repeat(2, 30px); gap: 3px;
}
.algo-op {
  width: 30px; height: 30px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  border: 1px solid var(--brd2); background: var(--sur2); color: var(--dim);
}
.algo-op.carrier  { background: rgba(58,158,255,.12); border-color: rgba(58,158,255,.4); color: var(--op-c); }
.algo-op.modulator{ background: rgba(155,107,255,.12); border-color: rgba(155,107,255,.4); color: var(--op-m); }

/* Checkbox row */
.cb-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0;
}
.cb-label { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.cb-val { font-family: var(--mono); font-size: 11px; color: var(--dim); }

/* AWM2 element tabs */
.elem-tabs {
  display: flex; gap: 4px; padding: 0 0 12px; flex-wrap: wrap;
}
.elem-tab {
  font-family: var(--mono); font-size: 10px;
  padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--brd2); background: var(--sur2);
  color: var(--dim); cursor: pointer; transition: all var(--tr);
}
.elem-tab.active { border-color: var(--acc); background: rgba(0,207,192,.08); color: var(--acc); }

/* ── RIGHT SIDEBAR ── */
.right {
  border-left: 1px solid var(--brd);
  background: var(--sur);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 14px; gap: 14px;
}
.info-title { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); margin-bottom: 6px; }
.delta-list { display: flex; flex-direction: column; gap: 3px; }
.delta-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 8px; background: var(--sur2); border-radius: 4px; border: 1px solid var(--brd);
}
.delta-name { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.delta-val { font-family: var(--mono); font-size: 10px; color: var(--acc); font-weight: 500; }
.no-chg { font-family: var(--mono); font-size: 11px; color: var(--mut); text-align: center; padding: 14px 0; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 22px; right: 22px;
  background: var(--sur2); border: 1px solid var(--brd2);
  border-radius: 8px; padding: 10px 16px;
  font-family: var(--mono); font-size: 12px; color: var(--txt);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s;
  z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.ok  { border-color: var(--grn); color: var(--grn); }
.toast.err { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="logo">YSFC<span class="logo-dot">.</span>FORGE<span class="logo-sub">Performance Editor v4.1</span></div>
  <span id="enginePill" style="display:none"></span>
  <span id="perfNameHdr" style="font-family:var(--mono);font-size:12px;color:var(--dim);display:none"></span>
  <div class="h-gap"></div>
  <button class="hbtn" id="langBtn" title="Switch language / Växla språk">
    <span>🌐</span> <span id="langLbl">SV</span>
  </button>
  <button class="hbtn" id="themeBtn">
    <span id="themeIco">☀</span> <span id="themeLbl">Light</span>
  </button>
  <label class="hbtn" style="cursor:pointer">
    <span data-i18n="open_y2l">Open Y2L</span>
    <input type="file" accept=".Y2L,.y2l" style="display:none" id="fileIn">
  </label>
  <button class="hbtn" id="exportBtn" disabled data-i18n="export_y2l">Export Y2L</button>
  <span id="dirtyInfo" style="font-family:var(--mono);font-size:10px;color:var(--acc);display:none"></span>
  <button class="hbtn" id="resetBtn" disabled data-i18n="reset">Reset</button>
</header>

<main>
  <!-- LEFT SIDEBAR -->
  <div class="left" id="leftSidebar">
    <div class="resize-handle" id="sidebarResizeHandle"></div>
    <!-- Performance name editor -->
    <div class="left-top" id="perfInfoBlock" style="display:none">
      <div class="sec-label" data-i18n="perf_name">Performance name</div>
      <input type="text" id="perfNameInput" class="name-input" maxlength="20"
        data-i18n-placeholder="perf_name_ph"
        placeholder="Performance name…"
        oninput="writePerfName(this.value)"
        data-i18n-title="perf_name_title"
        title="Max 20 characters, ASCII only">
    </div>

    <!-- Performance list -->
    <div class="left-perf-list" id="leftPerfList" style="display:none">
      <div class="sec-label" style="padding:6px 14px 4px;flex-shrink:0">
        <span data-i18n="performances">Performances</span>
        <span id="perfListCount" style="color:var(--mut);font-size:9px;margin-left:6px"></span>
      </div>
      <div id="perfListEl" class="perf-list-scroll"></div>
      <div class="list-resize-handle" id="listResizeHandle"></div>
    </div>

    <!-- Section nav -->
    <div class="sec-nav" id="secNav">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- CENTRE -->
  <div class="centre" id="centre">
    <div class="drop-zone">
      <div class="dz-icon">◈</div>
      <div class="dz-text" data-i18n="dz_text">Open a Y2L file to start editing</div>
      <div class="dz-sub" data-i18n="dz_sub">Supports FM-X, AWM2 and AN-X engines</div>
      <label class="hbtn" style="cursor:pointer;margin-top:10px;border-radius:6px;padding:7px 14px">
        <span data-i18n="choose_file">Choose file</span>
        <input type="file" accept=".Y2L,.y2l" style="display:none" id="fileIn2">
      </label>
    </div>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div class="right">
    <div>
      <div class="info-title" data-i18n="pending_changes">Pending Changes</div>
      <div class="delta-list" id="deltaList">
        <div class="no-chg" data-i18n="no_changes">No changes yet</div>
      </div>
    </div>
    <div id="opInfoWrap" style="display:none">
      <div class="info-title" id="opInfoTitle">OP Info</div>
      <div id="opInfoContent" style="font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.6"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
// YSFC Forge — Performance Editor v4.1
// Engines: FM-X · AWM2 · AN-X
// Serializer v5.10 — binärverifierade offsets (Steg 1–69max)
// ═══════════════════════════════════════════════════════════════════

// ── THEME ─────────────────────────────────────────────────────────
(function() {
  const s = localStorage.getItem('ysfc-theme');
  const t = s || 'light';
  applyTheme(t);
})();
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('ysfc-theme', t);
  document.getElementById('themeIco').textContent = t === 'dark' ? '☀' : '☾';
  document.getElementById('themeLbl').textContent = t === 'dark' ? 'Light' : 'Dark';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

// ── I18N ──────────────────────────────────────────────────────────

// ── PARSER ────────────────────────────────────────────────────────
// Parse ALL performances from a Y2L buffer.
// Returns { perfs: [{name, bytes, plen, dpfmBufOffset}], dpfmAbsOff }
// dpfmBufOffset = byte offset of this perf's data inside the DPFM chunk data
// Read chunk absolute file offset from EPFM directory (raw[72:136]).
function dirChunkPos(d, tag) {
  const tc = tag.split('').map(c => c.charCodeAt(0));
  for (let i = 0; i < 64; i += 8) {
    if (d[72+i]===tc[0]&&d[72+i+1]===tc[1]&&d[72+i+2]===tc[2]&&d[72+i+3]===tc[3]) {
      const pos = (d[72+i+4]<<24)|(d[72+i+5]<<16)|(d[72+i+6]<<8)|d[72+i+7];
      if (pos > 0 && pos + 8 < d.length) return pos;
    }
  }
  return -1;
}

function parseAllPerfs(buf) {
  const d = new Uint8Array(buf);

  // Validate YAMAHA-YSFC header
  const magic = String.fromCharCode(d[0],d[1],d[2],d[3],d[4],d[5],d[6],d[7],d[8],d[9],d[10]);
  if (magic !== 'YAMAHA-YSFC') throw new Error(t('err_not_y2l'));

  // EPFM is always at offset 64 in a valid Y2L/Y2U file
  if (d[64]!==0x45||d[65]!==0x50||d[66]!==0x46||d[67]!==0x4D)
    throw new Error(t('err_epfm_not_found'));

  // Locate DPFM via EPFM directory (matches v6.0 Python serializer)
  let dpfmAbsOff = dirChunkPos(d, 'DPFM');
  if (dpfmAbsOff < 0) {
    // Fallback: sequential scan for largest DPFM
    let best = -1, bestSz = 0;
    for (let i = 0; i < d.length - 8; i++) {
      if (d[i]===0x44&&d[i+1]===0x50&&d[i+2]===0x46&&d[i+3]===0x4D) {
        const sz = (d[i+4]<<24)|(d[i+5]<<16)|(d[i+6]<<8)|d[i+7];
        if (sz > bestSz) { bestSz=sz; best=i; }
      }
    }
    if (best < 0) throw new Error(t('err_dpfm_not_found'));
    dpfmAbsOff = best;
  }

  const dpfm = d.subarray(dpfmAbsOff+8);
  const n = (dpfm[0]<<24)|(dpfm[1]<<16)|(dpfm[2]<<8)|dpfm[3];
  if (n < 1 || n > 256) throw new Error(t('err_invalid_count',{n}));

  // Read EPFM catalog Entr-record positions for name sync during export
  // Catalog stream starts at file[361] = file[72+289]
  const catTag = String.fromCharCode(d[72+281],d[72+282],d[72+283],d[72+284]);
  const catEntries = [];
  if (catTag === 'EPFM') {
    const dv2 = new DataView(buf);
    const catN = dv2.getUint32(72+289, false);
    let cpos = 4;  // relative to stream start
    const streamBase = 361;  // = 72 + 289 (file offset of catalog stream[0])
    for (let ci = 0; ci < catN && ci < 256; ci++) {
      const abs = streamBase + cpos;
      if (abs + 8 > d.length) break;
      if (d[abs]!==0x45||d[abs+1]!==0x6e||d[abs+2]!==0x74||d[abs+3]!==0x72) break;
      const esz = dv2.getUint32(abs+4, false);
      catEntries.push({ abs: abs+8, size: esz });
      cpos += 8 + esz;
    }
  }

  const perfs = [];
  // DPFM layout: [0:4]=count, then N x (Data[4]+plen[4]+data[plen])
  let pos = 4;
  for (let i = 0; i < n; i++) {
    if (pos + 8 > dpfm.length) break;
    const plen = (dpfm[pos+4]<<24)|(dpfm[pos+5]<<16)|(dpfm[pos+6]<<8)|dpfm[pos+7];
    const dataStart = pos + 8;
    if (dataStart + plen > dpfm.length) break;
    const bytes = new Uint8Array(dpfm.buffer, dpfm.byteOffset + dataStart, plen).slice();
    const name = readPerfNameFromBytes(bytes);
    perfs.push({
      name, bytes, plen,
      dpfmBufOffset: dataStart,
      catEntry: catEntries[i] || null,
    });
    pos = dataStart + plen;
  }
  if (perfs.length === 0) throw new Error(t('err_no_perfs'));
  return { perfs, dpfmAbsOff };
}
// Legacy compat — parse first perf only (kept for any internal callers)
function parsePerfBytes(buf) {
  return parseAllPerfs(buf).perfs[0].bytes;
}

function detectEngine(perf) {
  const plen = perf.length;
  if (plen < 6708) return 'FMX';
  const pds = plen - PART_BASE;
  const eq = pds;  // single-part heuristic
  if (eq >= 6430 && eq <= 6465) return 'ANX';
  if (eq >= 6890 && eq <= 6930) return 'FMX';
  if (eq >= 6000 && eq <= 13500) return 'AWM2';
  return 'FMX';
}

function opBase(op) { return OP1_BASE + (op-1)*OP_STRIDE; }

// ── WRITE / DELTA ─────────────────────────────────────────────────
function writeByte(abs, val, label) {
  if (!S.perfBytes || abs < 0 || abs >= S.perfBytes.length) return;
  val = val & 0xFF;
  S.perfBytes[abs] = val;
  const orig = S.origBytes[abs];
  if (val !== orig) {
    S.changes[abs] = { label, orig, cur: val };
    S.dirtyPerfs.add(S.perfIdx);
  } else {
    delete S.changes[abs];
  }
  renderDeltas();
}

function onSlider(id, label, uiVal, min, max, abs, encType) {
  const v = Number(uiVal);
  const clamped = Math.max(min, Math.min(max, v));
  const raw = enc[encType] ? enc[encType](clamped) : clamped;
  // Format display
  const centered = ['center7','center15','center50','center64','center128','kf'].includes(encType);
  const display = centered ? (clamped >= 0 ? '+'+clamped : ''+clamped) : clamped;
  const valEl = document.getElementById(id+'_v');
  if (valEl) {
    valEl.textContent = display;
    valEl.className = 'sval' + (raw !== S.origBytes[abs] ? ' chg' : '');
  }
  const slEl = document.getElementById(id);
  if (slEl) slEl.className = raw !== S.origBytes[abs] ? 'chg' : '';
  writeByte(abs, raw, label);
  if (S.engine === 'FMX' && S.section === 'op') renderOpNav();
}

// ── SLIDER BUILDER ────────────────────────────────────────────────
function sl(id, label, uiVal, min, max, abs, encType, fmtFn) {
  if (!S.origBytes || abs < 0 || abs >= S.perfBytes.length) return '';
  const orig = S.origBytes[abs];
  const cur  = S.perfBytes[abs];
  const chg  = cur !== orig;
  const display = fmtFn ? fmtFn(uiVal) : (
    ['center7','center15','center50','center64','center128','kf'].includes(encType)
      ? (uiVal >= 0 ? '+'+uiVal : ''+uiVal) : uiVal
  );
  return `<div class="srow">
    <div class="srow-hdr">
      <span class="sname">${label}</span>
      <span class="sval${chg?' chg':''}" id="${id}_v">${display}</span>
    </div>
    <input type="range" id="${id}" class="${chg?'chg':''}"
      min="${min}" max="${max}" value="${uiVal}"
      oninput="onSlider('${id}','${label}',this.value,${min},${max},${abs},'${encType}')">
  </div>`;
}

function selRow(label, val, opts, abs, labelPfx, onChg) {
  const optsHtml = opts.map((n,i)=>`<option value="${i}" ${i===val?'selected':''}>${n}</option>`).join('');
  const id = 'sel_'+abs;
  return `<div class="srow">
    <div class="srow-hdr"><span class="sname">${label}</span>
      <span class="sval" id="${id}_v">${opts[val]||val}</span></div>
    <select onchange="writeByte(${abs},+this.value,'${labelPfx} ${label}');document.getElementById('${id}_v').textContent=this.options[this.selectedIndex].text">
      ${optsHtml}</select>
  </div>`;
}

function cbRow(label, val, abs, lbl) {
  return `<div class="cb-row">
    <span class="cb-label">${label}</span>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" ${val?'checked':''}
        onchange="writeByte(${abs},this.checked?1:0,'${lbl} ${label}')">
      <span class="cb-val">${val?'On':'Off'}</span>
    </label>
  </div>`;
}

function renderOpNav() { renderFMXNav(document.getElementById('secNav')); }

function renderAWM2Nav(nav) {
  // Count active AWM2 elements (waveform > 0)
  // Waveform at abs 12520 (AWM2_ELEM.waveformLo), stride 313 bytes (Serializer v6.0)
  const AWM2_ELEM_STRD = 313;
  let numElems = 1;
  if (S.perfBytes) {
    numElems = 0;
    for (let e = 0; e < 8; e++) {
      const off = 12520 + e * AWM2_ELEM_STRD;
      if (off + 1 >= S.perfBytes.length) break;
      const wf = S.perfBytes[off] + S.perfBytes[off+1]*256;
      if (wf > 0 && wf < 9999) numElems++;
    }
    numElems = Math.max(1, numElems);
  }
  let html = '<div class="nav-group"><span class="nav-group-label">'+t('nav_elements')+'</span>';
  for (let e = 1; e <= numElems; e++) {
    const wfOff = AWM2_ELEM.waveformLo + (e-1) * AWM2_ELEM_STRD;
    const wfNr = (wfOff+1 < S.perfBytes.length)
      ? S.perfBytes[wfOff] + S.perfBytes[wfOff+1]*256 : 0;
    const active = S.section === 'awm2_elem' && S.selElem === e;
    html += '<div class="nav-item' + (active?' active':'') + '" onclick="selectAWM2Elem('+e+')">'
      + '<span class="nav-num" style="color:var(--accent)">Elem '+e+'</span>'
      + '<span class="nav-val">#'+wfNr+'</span></div>';
  }
  html += '</div><div class="nav-group"><span class="nav-group-label">'+t('nav_sections')+'</span>';
  const secs = [
    ['awm2_part', t('sec_part_common')],
    ['awm2_aeg',  t('sec_part_aeg_offset')],
    ['awm2_feg',  t('sec_part_filter_eg')],
    ['awm2_fx',   t('sec_insertion_fx')],
  ];
  for (const [id, lbl] of secs) {
    html += navItem('nav_'+id, lbl, '', S.section===id, "selectSec('"+id+"')");
  }
  html += '</div>';
  nav.innerHTML = html;
}

function selectAWM2Elem(e) {
  S.selElem = e;
  S.section = 'awm2_elem';
  renderNav();
  renderCentre();
}

function renderANXNav(nav) {

    ['anx_part', t('sec_part_common')],

}

function updateFX(ab, idxStr) {
  const idx = +idxStr;

function renderAWM2Elem(c, elemNr) {
  elemNr = elemNr || 1;

  const p = S.perfBytes;
  const E = AWM2_ELEM;
  const wfLoAbs = E.waveformLo + eOff;
  const wfHiAbs = E.waveformHi + eOff;
  const wfNr = (wfLoAbs < p.length ? p[wfLoAbs] : 0) + (wfHiAbs < p.length ? p[wfHiAbs] : 0)*256;
  const filterCutoff = u16le(p, PART_BASE+5857);

  // Filter type
  const ftRaw = p[PART_BASE+4];
  const ftName = AWM2_FILTER_TYPES[ftRaw] || 'LPF12D';
  const ftOpts = AWM2_FILTER_TYPES.map((n,i)=>
    `<option value="${i}" ${i===ftRaw?'selected':''}>${n}</option>`).join('');

  c.innerHTML = esec(t('es_elem_waveform',{n:elemNr}), '', `
    <div class="pgrid">

            onchange="updateWaveform(this.value)">
          <span style="font-family:var(--mono);font-size:10px;color:var(--mut)">u16 LE</span>
        </div>
      </div>
      ${sl('aw_nl','Note Low',  p[E.noteLowLimit],   0,127,E.noteLowLimit,  'direct')}
      ${sl('aw_nh','Note High', p[E.noteHighLimit],  0,127,E.noteHighLimit, 'direct')}
      ${sl('aw_vl','Vel Low',   p[E.velLowLimit],    1,127,E.velLowLimit,   'direct')}
      ${sl('aw_vc','Vel X-Fade',p[E.velCrossFade],   0,127,E.velCrossFade,  'direct')}
      ${sl('aw_kd','KeyOn Delay',p[E.keyOnDelayLength],0,127,E.keyOnDelayLength,'direct')}
    </div>`) +
  esec(t('es_elem_filter'), '', `
    <div class="pgrid">
      <div class="srow"><div class="srow-hdr"><span class="sname">Filter Type</span>
        <span class="sval" id="ft_v">${ftName}</span></div>
        <select onchange="writeByte(${PART_BASE+4},+this.value,'Filter Type');document.getElementById('ft_v').textContent=AWM2_FILTER_TYPES[+this.value]||this.value">${ftOpts}</select>
      </div>
      <div class="srow"><div class="srow-hdr"><span class="sname">Cutoff</span>
        <span class="sval" id="aw_cut_v">${filterCutoff} Hz</span></div>
        <input type="range" id="aw_cut" min="0" max="8191" value="${filterCutoff}"
          oninput="updateAWM2Cutoff(this.value)">
      </div>
      ${sl('aw_re','Resonance',  p[E.filterResonance],0,127,E.filterResonance,'direct')}
      ${sl('aw_fd','FEG Depth',  dec.center64(p[E.filterFEGDepth])-40,-64,63,E.filterFEGDepth,'center64')}
    </div>`) +
  esec(t('es_elem_aeg'), t('badge_center64'), `
    <div class="pgrid">
      ${sl('aw_lv','Level Vel',  dec.center64(p[E.levelVel]),   -64,63,E.levelVel, 'center64')}
      ${sl('aw_ao','AEG Offset', dec.center64(p[E.aegOffset]),  -64,63,E.aegOffset,'center64')}
      ${sl('aw_tv','AEG TimeVel',dec.center64(p[E.aegTimeVel]),-64,63,E.aegTimeVel,'center64')}
    </div>`) +
  esec(t('es_pan'), '', `<div class="pgrid">
    ${sl('aw_rp','Random Pan',    dec.center64(p[E.randomPan]),   -64,63,E.randomPan,   'center64')}
    ${sl('aw_ap','Alternate Pan', dec.center64(p[E.alternatePan]),-64,63,E.alternatePan,'center64')}
    ${sl('aw_sp','Scaling Pan',   dec.center64(p[E.scalingPan]),  -64,63,E.scalingPan,  'center64')}
  </div>`);
}
function updateWaveform(v, eOff) {
  eOff = eOff || 0;
  const nr = Math.max(1, Math.min(9999, Math.round(+v)));
  writeByte(AWM2_ELEM.waveformLo + eOff,  nr & 0xFF,       'Waveform lo');
  writeByte(AWM2_ELEM.waveformHi + eOff, (nr >> 8) & 0xFF, 'Waveform hi');
}
function updateAWM2Cutoff(v) {
  document.getElementById('aw_cut_v').textContent = v + ' Hz';

}

  const p = S.perfBytes;
  const A = ANX;
  const isF1 = n === 1;
  const prefix = isF1 ? 'flt1' : 'flt2';
  const typAbs = isF1 ? A.flt1Type : A.flt2Type;
  const cutAbs = isF1 ? A.flt1CutoffLo : A.flt2CutoffLo;
  const resAbs = isF1 ? A.flt1Resonance : A.flt2Resonance;
  const drvAbs = isF1 ? A.flt1Drive : A.flt2Drive;
  const kfAbs  = isF1 ? A.flt1CutoffKeyFollow : A.flt2CutoffKeyFollow;
  const fegAbs = isF1 ? A.flt1FEGDepthLo : A.flt2FEGDepthLo;

  const typeRaw = p[typAbs];
  const typeOpts = ANX_FLT_TYPES.map((n,i)=>`<option value="${i}" ${i===typeRaw?'selected':''}>${n}</option>`).join('');
  const cutHz = u16le(p, cutAbs);
  // FEGDepth: u16 LE center=256, raw=round(UI/50)+256
  const fegRaw = u16le(p, fegAbs);
  const fegUI  = (fegRaw - 256) * 50;

  c.innerHTML = esec(t('es_filter_n',{n}), '', `
    <div class="pgrid">
      <div class="srow"><div class="srow-hdr"><span class="sname">Type</span>
        <span class="sval" id="${prefix}_typ_v">${ANX_FLT_TYPES[typeRaw]||typeRaw}</span></div>
        <select onchange="writeByte(${typAbs},+this.value,'F${n} Type');document.getElementById('${prefix}_typ_v').textContent=ANX_FLT_TYPES[+this.value]||this.value">${typeOpts}</select>
      </div>
      <div class="srow"><div class="srow-hdr"><span class="sname">Cutoff</span>
        <span class="sval" id="${prefix}_cut_v">${cutHz} Hz</span></div>
        <input type="range" id="${prefix}_cut" min="0" max="8191" value="${cutHz}"
          oninput="updateANXCutoff(${cutAbs},'${prefix}',this.value)">
      </div>
      ${sl(prefix+'_re','Resonance', p[resAbs],0,127,resAbs,'direct')}
      ${sl(prefix+'_dr','Drive',     p[drvAbs],0,80, drvAbs,'direct')}
      ${sl(prefix+'_kf','Key Follow (enum)', p[kfAbs],0,7,kfAbs,'direct')}
    </div>
    <div style="margin-top:10px"><div class="sname" style="margin-bottom:8px">${t('es_feg_filter_eg_depth')}</div>
    <div class="srow">
      <div class="srow-hdr">
        <span class="sname">FEG Depth (±12700 cents)</span>
        <span class="sval" id="${prefix}_feg_v">${fegUI}</span>
      </div>
      <input type="range" id="${prefix}_feg" min="-12700" max="12700" step="50" value="${fegUI}"
        oninput="updateANXFEGDepth(${fegAbs},'${prefix}',this.value)">
    </div></div>`);
}
function updateANXCutoff(abs, prefix, v) {
  document.getElementById(prefix+'_cut_v').textContent = v + ' Hz';
  writeByte(abs,   +v & 0xFF,       'F Cutoff lo');
  writeByte(abs+1,(+v >> 8) & 0xFF, 'F Cutoff hi');
}
function updateANXFEGDepth(abs, prefix, v) {
  const ui = Math.round(+v / 50) * 50;
  document.getElementById(prefix+'_feg_v').textContent = ui;
  const raw = Math.max(0, Math.min(511, Math.round(ui/50) + 256));
  writeByte(abs,   raw & 0xFF,       'FEG Depth lo');
  writeByte(abs+1,(raw >> 8) & 0xFF, 'FEG Depth hi');
}

// ── SECTION HELPER ────────────────────────────────────────────────
function esec(title, badge, body) {
  const bdg = badge ? `<div class="esec-badge">${badge}</div>` : '';
  return `<div class="esec">
    <div class="esec-hdr"><div class="esec-title">${title}</div>${bdg}</div>
    <div class="esec-body">${body}</div>
  </div>`;
}

// ── DELTA PANEL ───────────────────────────────────────────────────
function renderDeltas() {
  const list = document.getElementById('deltaList');
  const entries = Object.values(S.changes);
  if (!entries.length) {
    list.innerHTML = '<div class="no-chg">' + t('no_changes') + '</div>';
    return;
  }
  list.innerHTML = entries.slice(-14).reverse().map(c => `
    <div class="delta-item">
      <span class="delta-name">${c.label}</span>
      <span class="delta-val">${c.orig} → ${c.cur}</span>
    </div>`).join('');
  document.getElementById('exportBtn').disabled = false;
  // Update dirty count indicator
  const di = document.getElementById('dirtyInfo');
  if (di) {
    const n = S.dirtyPerfs.size;
    di.textContent = n > 0 ? t('edited_label', {n}) : '';
    di.style.display = n > 0 ? '' : 'none';
  }
}

// ── FILE LOADING ──────────────────────────────────────────────────
function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const { perfs, dpfmAbsOff } = parseAllPerfs(e.target.result);
      S.rawBuffer  = e.target.result;
      S.allPerfs   = perfs;
      S.dpfmAbsOff = dpfmAbsOff;
      S.fileName   = file.name;
      S.dirtyPerfs = new Set();
      S.changes    = {};

      renderPerfList();
      selectPerf(0);
      showToast(t('toast_loaded',{n:perfs.length, pl: perfs.length>1?'s':'', file: file.name}), 'ok');
    } catch(err) {
      showToast(t('toast_error',{msg: err.message}), 'err');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Populate the performance list panel
function renderPerfList() {
  const list = document.getElementById('perfListEl');
  if (!list) return;
  list.innerHTML = '';
  S.allPerfs.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'perf-list-item' + (i === S.perfIdx ? ' active' : '') + (S.dirtyPerfs.has(i) ? ' dirty' : '');
    div.dataset.idx = i;
    const engine = detectEngine(p.bytes);
    const engCls = engine === 'FMX' ? 'pill-FMX' : engine === 'AWM2' ? 'pill-AWM2' : 'pill-ANX';
    const engLbl = engine === 'FMX' ? 'FM-X' : engine === 'AWM2' ? 'AWM2' : 'AN-X';
    div.innerHTML =
      '<span class="pli-dot"></span>' +
      '<span class="pli-num">' + String(i+1).padStart(3,'0') + '</span>' +
      '<span class="engine-pill ' + engCls + '" style="font-size:8px;padding:1px 5px">' + engLbl + '</span>' +
      '<span class="pli-name">' + escHtml(p.name) + '</span>';
    div.onclick = () => selectPerf(i);
    list.appendChild(div);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Switch to a different performance in the list
function selectPerf(idx) {
  if (!S.allPerfs[idx]) return;
  // Save current changes back into allPerfs before switching
  if (S.perfBytes && S.perfIdx !== undefined && S.allPerfs[S.perfIdx]) {
    S.allPerfs[S.perfIdx].bytes = new Uint8Array(S.perfBytes);
    S.allPerfs[S.perfIdx].name = S.perfName;
    if (Object.keys(S.changes).length > 0) S.dirtyPerfs.add(S.perfIdx);
  }

  S.perfIdx   = idx;
  const p     = S.allPerfs[idx];
  S.perfBytes = new Uint8Array(p.bytes);
  S.origBytes = new Uint8Array(p.bytes);
  S.perfName  = p.name;
  S.engine    = detectEngine(p.bytes);
  S.changes   = {};

  if (S.engine === 'FMX') {
    S.algo = dec.algo(p.bytes[ALG_ABS]);
    S.section = 'op'; S.selOp = 1;
  } else if (S.engine === 'AWM2') {
    S.section = 'awm2_elem'; S.selElem = 1;
  } else {
    S.section = 'anx_osc';
  }

  // Update header
  const pillColors = { FMX: 'pill-FMX', AWM2: 'pill-AWM2', ANX: 'pill-ANX' };
  const pillLabels = { FMX: 'FM-X', AWM2: 'AWM2', ANX: 'AN-X' };
  const pill = document.getElementById('enginePill');
  pill.className = 'engine-pill ' + (pillColors[S.engine]||'');
  pill.textContent = pillLabels[S.engine] || S.engine;
  pill.style.display = '';
  document.getElementById('perfNameHdr').style.display = '';
  document.getElementById('perfInfoBlock').style.display = '';
  document.getElementById('exportBtn').disabled = false;
  document.getElementById('resetBtn').disabled = false;
  document.getElementById('deltaList').innerHTML = '<div class="no-chg">' + t('no_changes') + '</div>';

  updateNameDisplay();
  renderPerfList();
  renderNav();
  renderCentre();
}

// Update all name displays from S.perfName
function updateNameDisplay() {
  // header span
  const hdr = document.getElementById('perfNameHdr');
  if (hdr) hdr.textContent = S.allPerfs.length > 1
    ? `[${S.perfIdx+1}/${S.allPerfs.length}] ${S.perfName}`
    : S.perfName;
  // name input
  const inp = document.getElementById('perfNameInput');
  if (inp) inp.value = S.perfName;
  // show/hide perf list panel
  const listPanel = document.getElementById('leftPerfList');
  if (listPanel) listPanel.style.display = S.allPerfs.length > 0 ? '' : 'none';
  // update count badge
  const badge = document.getElementById('perfListCount');
  if (badge) badge.textContent = S.allPerfs.length > 1 ? `(${S.allPerfs.length})` : '';
}

// Write performance name into perfBytes (perf[4:22], null-terminated)
// CRITICAL: never overwrite perf[23+] — those are timestamps MODX validates
function writePerfName(newName) {
  if (!S.perfBytes) return;
  const safe = newName.replace(/[^ -~]/g, '').slice(0, 20);
  const nb = new TextEncoder().encode(safe);
  // Clear only name bytes up to null terminator
  for (let i = 4; i < 4 + 20; i++) S.perfBytes[i] = 0;
  nb.forEach((b, i) => { S.perfBytes[4 + i] = b; });
  S.perfBytes[4 + nb.length] = 0; // null terminator — do NOT touch [23+]
  S.perfName = safe || 'Unnamed';
  // Track as change
  S.changes['_name'] = { label: t('perf_name_change'), orig: S.allPerfs[S.perfIdx]?.name, cur: safe };
  S.dirtyPerfs.add(S.perfIdx);
  updateNameDisplay();
  renderDeltas();
  renderPerfList();
}

function readPerfNameFromBytes(perf) {
  let s = '';
  for (let i = 4; i < 36; i++) {
    if (perf[i] === 0) break;
    s += String.fromCharCode(perf[i]);
  }
  return s.trim() || 'Unnamed';
}
// Alias för bakåtkompatibilitet
function readPerfName(perf) { return readPerfNameFromBytes(perf); }

// ── EXPORT ────────────────────────────────────────────────────────
function exportY2L() {
  if (!S.rawBuffer || !S.allPerfs.length) return;

  // Flush current perf's pending edits into allPerfs
  if (S.perfBytes && S.allPerfs[S.perfIdx]) {
    S.allPerfs[S.perfIdx].bytes = new Uint8Array(S.perfBytes);
    S.allPerfs[S.perfIdx].name = S.perfName;
    if (Object.keys(S.changes).length > 0) S.dirtyPerfs.add(S.perfIdx);
  }

  // Build result by patching all dirty performances back into original buffer
  const result = new Uint8Array(S.rawBuffer);
  const dpfmChunkStart = S.dpfmAbsOff + 8; // skip chunk tag+size = +8

  // Perf data starts at: dpfmChunkStart + 4 (count) + per-entry: 8 (tag+plen) + plen
  // We use the pre-computed dpfmBufOffset from parseAllPerfs
  let patchCount = 0;
  S.allPerfs.forEach((p, i) => {
    if (!S.dirtyPerfs.has(i)) return;

    // 1. Patch DPFM performance blob
    const absStart = dpfmChunkStart + p.dpfmBufOffset;
    if (absStart + p.bytes.length <= result.length)
      p.bytes.forEach((b, j) => { result[absStart + j] = b; });

    // 2. Patch EPFM catalog name if it changed (Entr[26+1] = ASCII name + null)
    // Entr record layout: [0:4]=blob_size, [4:8]=blob_dp_off, [10:12]=idx, [26:]=?+name+0
    if (p.catEntry && p.catEntry.abs + p.catEntry.size <= result.length) {
      const nameAbs = p.catEntry.abs + 27;  // [26]=unknown byte, [27]=name start
      const nb = new TextEncoder().encode(p.name.slice(0, 20));
      nb.forEach((b, k) => { if (nameAbs + k < result.length) result[nameAbs + k] = b; });
      // Null-terminate
      if (nameAbs + nb.length < result.length) result[nameAbs + nb.length] = 0;
    }
  });

  const suffix = S.dirtyPerfs.size > 0 ? `_${S.dirtyPerfs.size}edited` : '_edited';
  const blob = new Blob([result], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = S.fileName.replace(/\.y2l$/i,'') + suffix + '.Y2L';
  a.click();
  URL.revokeObjectURL(a.href);
  const total = S.dirtyPerfs.size || 1;
  showToast(t('toast_exported',{n: total, pl: total>1?'s':''}), 'ok');
}

function resetChanges() {
  if (!S.allPerfs[S.perfIdx]) return;
  // Restore from original parsed bytes (re-parse from rawBuffer)
  const { perfs } = parseAllPerfs(S.rawBuffer);
  const orig = perfs[S.perfIdx];
  if (!orig) return;
  S.perfBytes = new Uint8Array(orig.bytes);
  S.origBytes = new Uint8Array(orig.bytes);
  S.allPerfs[S.perfIdx].bytes = new Uint8Array(orig.bytes);
  S.allPerfs[S.perfIdx].name = orig.name;
  S.perfName = orig.name;
  S.changes = {};
  S.dirtyPerfs.delete(S.perfIdx);
  updateNameDisplay();
  renderPerfList();
  renderCentre();
  renderDeltas();
  showToast(t('toast_reset'));
}

// ── TOAST ─────────────────────────────────────────────────────────
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2500);
}

// ── EVENT LISTENERS ───────────────────────────────────────────────
['fileIn','fileIn2'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
    e.target.value = '';
  });
});
document.getElementById('exportBtn').addEventListener('click', exportY2L);
document.getElementById('resetBtn').addEventListener('click', resetChanges);

// Drag-and-drop
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f && /\.y2l$/i.test(f.name)) loadFile(f);
});

// ── RESIZE LOGIC ─────────────────────────────────────────────────
function initResizeHandles() {
  // Sidebar width resize
  const sHandle = document.getElementById('sidebarResizeHandle');
  const mainEl  = document.querySelector('main');
  if (sHandle && mainEl) {
    let startX, startW;
    sHandle.addEventListener('mousedown', e => {
      startX = e.clientX;
      startW = parseInt(getComputedStyle(document.documentElement)
                        .getPropertyValue('--left-w') || '220', 10);
      sHandle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function onMove(e) {
        const newW = Math.max(160, Math.min(480, startW + (e.clientX - startX)));
        document.documentElement.style.setProperty('--left-w', newW + 'px');
      }
      function onUp() {
        sHandle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
  }

  // Perf-list height resize
  const lHandle = document.getElementById('listResizeHandle');
  const listPanel = document.getElementById('leftPerfList');
  if (lHandle && listPanel) {
    let startY, startH;
    lHandle.addEventListener('mousedown', e => {
      startY = e.clientY;
      startH = listPanel.offsetHeight;
      lHandle.classList.add('dragging');
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
      function onMove(e) {
        const newH = Math.max(60, Math.min(window.innerHeight * 0.7,
                                           startH + (e.clientY - startY)));
        document.documentElement.style.setProperty('--list-h', newH + 'px');
      }
      function onUp() {
        lHandle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
  }
}
